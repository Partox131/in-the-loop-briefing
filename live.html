<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In the Loop · Live map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F8; --raise: #FFFFFF; --ink: #1D2147; --muted: #5B6080; --line: #E2E5EF; --track: #E2E5EF;
    --loop: #3047D6; --on-loop: #FFFFFF; --bars: #B9C1E6;
    --reported: #8A5608; --reported-dot: #C27A10;
    --confirmed: #0F6B5C; --disputed: #9B2C74; --new: #3047D6;
    --warn: #8A5608; --banner-bg: #FBEFD8;
    --display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --sea: #EAEEF7; --land: #FFFFFF; --border: #CDD3E6;
    --sea-deep: #CBD3EA; --land-dim: #FFFFFF; --focus-land: #D6DDFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142B; --raise: #1B1E3B; --ink: #E7E9F5; --muted: #A3A8C8; --line: #2C3056; --track: #2A2E52;
      --loop: #7C8FFF; --on-loop: #12142B; --bars: #4A5390;
      --reported: #F0C27A; --reported-dot: #E0A040;
      --confirmed: #7FD6C2; --disputed: #F0A8D6; --new: #9DB0FF;
      --warn: #F0C27A; --banner-bg: #3A2E14;
      --sea: #161935; --land: #23274A; --border: #343A6A;
      --sea-deep: #0A0B1C; --land-dim: #23274A; --focus-land: #353E85;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
  a { color: var(--loop); }
  :focus-visible { outline: 3px solid var(--loop); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 40px; }

  header.top { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 9px; font: 800 22px/1 var(--display); letter-spacing: -0.01em; color: inherit; text-decoration: none; border-radius: 6px; }
  .brand:hover { color: var(--loop); }
  nav.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
  nav.crumbs .here { color: var(--ink); font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--track); border-radius: 999px; padding: 4px; }
  .tabs a { text-decoration: none; color: var(--muted); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; min-height: 40px; display: flex; align-items: center; }
  .tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .status.on .pulse-dot { background: #D92D3A; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .bar { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; padding: 8px 0 16px; }
  h1 { margin: 0; font: 800 clamp(30px, 4vw, 46px)/1.05 var(--display); letter-spacing: -0.02em; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 16px; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; min-width: 0; max-width: 100%; }
  .seg { display: flex; gap: 2px; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 8px 14px; min-height: 40px; border-radius: 999px; font-size: 15px; white-space: nowrap; flex: none; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  .layout { display: flex; flex-wrap: wrap; gap: 28px; padding-bottom: 48px; }
  .mapcol { flex: 999 1 620px; min-width: 0; }
  .map { position: relative; background: var(--sea); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .map svg { display: block; width: 100%; height: auto; }
  .country { fill: var(--land); stroke: var(--border); stroke-width: .8; }
  .bubble { cursor: pointer; }
  .bubble .disc { stroke-width: 2.5; transition: r .6s ease; }
  .bubble:hover .disc, .bubble.sel .disc { stroke-width: 4; }
  .bubble:focus { outline: none; }
  .bubble:focus-visible .disc { stroke: var(--loop); stroke-width: 5; }
  .bubble text { font-family: var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .bubble .name { font-weight: 700; font-size: 15px; }
  .bubble .meta { font-size: 13px; fill: var(--muted); }
  .bubble.quiet .name { font-weight: 600; fill: var(--muted); font-size: 13px; }
  .ring { fill: none; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.5); opacity: 0; } }
  .flash { transform-box: fill-box; transform-origin: center; animation: flash 1.8s ease-out 1 forwards; fill: none; stroke: var(--loop); stroke-width: 4; }
  @keyframes flash { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .leader { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .anchor { fill: var(--ink); }
  /* Zoom between views: bubbles fade, the camera flies, the new view pops in. */
  .map { transition: height .95s cubic-bezier(.65, 0, .35, 1), border-color .6s, background-color .6s; }
  .map.leaving .bubble, .map.leaving .leader, .map.leaving .anchor, .map.leaving .clabel, .map.leaving .cartouche { opacity: 0; transition: opacity .2s; }
  .map.flying svg { height: 100%; }
  .map.flying .country { vector-effect: non-scaling-stroke; transition: fill .9s; }
  .map.arrive .country, .map.arrive .grat, .map.arrive .clabel { animation: fadein .5s ease-out both; }
  .map.arrive .bubble { animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i, 0) * 50ms + 80ms); transform-box: fill-box; transform-origin: center; }
  .map.arrive .cartouche { animation: slidein .5s .15s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes slidein { from { opacity: 0; transform: translateY(-10px); } }
  .bubble { transition: opacity .2s; }
  .frame { fill: color-mix(in srgb, var(--loop) 6%, transparent); stroke: var(--loop); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .frame.on { opacity: 1; }

  /* The zoomed-in region view: an atlas look, with the countries at the heart of it lit up. */
  .map.zoomed { background: radial-gradient(ellipse at 50% 42%, var(--sea) 52%, var(--sea-deep) 100%); border-color: color-mix(in srgb, var(--loop) 35%, var(--line)); }
  .zoomed .country { fill: var(--land-dim); }
  .zoomed .country.focus { fill: var(--focus-land); stroke: color-mix(in srgb, var(--loop) 55%, var(--border)); stroke-width: 1.1; }
  .zoomed .country.watch { fill: color-mix(in srgb, var(--focus-land) 40%, var(--land-dim)); }
  .grat { fill: none; stroke: var(--border); stroke-width: .7; stroke-dasharray: 2 5; opacity: .8; }
  .clabel { font-family: var(--body); font-weight: 700; letter-spacing: .24em; fill: var(--muted); opacity: .5; pointer-events: none; }
  .zoomed .bubble text { stroke: var(--focus-land); }
  .cartouche { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 28px); background: color-mix(in srgb, var(--raise) 88%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 8px 8px; box-shadow: 0 6px 24px -12px rgba(20, 24, 60, .35); }
  .cartouche .back { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .cartouche .kick { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--loop); }
  .cartouche strong { display: block; font: 800 20px/1.1 var(--display); }
  .cartouche small { display: block; color: var(--muted); font-size: 13px; }

  /* Backgrounders: the broad story of each region, for newcomers. */
  .bg { border-color: color-mix(in srgb, var(--loop) 30%, var(--line)); }
  .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--loop); }
  .lede { margin: 10px 0 4px; font-size: 16px; }
  details.conflict { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  details.conflict summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; padding: 8px 28px 8px 0; position: relative; }
  details.conflict summary::-webkit-details-marker { display: none; }
  details.conflict summary::after { content: '+'; position: absolute; right: 4px; top: 8px; font: 700 20px/1 var(--display); color: var(--loop); }
  details.conflict[open] summary::after { content: '−'; }
  .ctitle { font: 700 18px/1.25 var(--display); }
  .since { font-size: 13px; color: var(--muted); }
  details.conflict h3 { margin: 14px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  details.conflict p { margin: 0 0 6px; font-size: 15px; line-height: 1.5; }
  dl.sides { margin: 0; font-size: 15px; }
  dl.sides dt { font-weight: 700; margin-top: 8px; }
  dl.sides dt:first-child { margin-top: 0; }
  dl.sides dd { margin: 2px 0 0; line-height: 1.5; }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .fig { background: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .fig strong { font: 800 22px/1.1 var(--display); color: var(--ink); }
  .fig span { color: var(--ink); }
  .fig a { color: var(--muted); font-size: 12px; }
  ol.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--track); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  ol.tl li { position: relative; }
  ol.tl li::before { content: ''; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--raise); border: 2px solid var(--loop); }
  ol.tl time { display: block; font-weight: 700; font-size: 13px; color: var(--loop); }
  .now { background: color-mix(in srgb, var(--loop) 8%, transparent); border-radius: 10px; padding: 10px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 14px; }
  .chips button:hover { border-color: var(--loop); color: var(--loop); }
  .fine { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  .regionlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .regionlist button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .regionlist button:hover { border-color: var(--loop); }
  .regionlist strong { font: 700 17px/1.2 var(--display); }
  .regionlist span { font-size: 14px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .ring, .flash, .status.on .pulse-dot, .map.arrive .bubble, .map.arrive .country, .map.arrive .grat, .map.arrive .clabel, .map.arrive .cartouche { animation: none; }
    .map, .frame, .bubble { transition: none; }
  }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 12px 2px 0; font-size: 14px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .c-corroborated { --c: var(--confirmed); } .c-reported { --c: var(--reported-dot); } .c-disputed { --c: var(--disputed); } .c-quiet { --c: var(--muted); }
  .sw { background: var(--c); }
  .chip { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
  .chip.c-corroborated, .chip.c-official { color: var(--confirmed); background: color-mix(in srgb, var(--confirmed) 14%, transparent); }
  .chip.c-reported { color: var(--reported); background: color-mix(in srgb, var(--reported-dot) 18%, transparent); }
  .chip.c-disputed { color: var(--disputed); background: color-mix(in srgb, var(--disputed) 14%, transparent); }
  .news-tag { background: none; border: 1px solid var(--track); }
  .area-tag { font-size: 13px; font-weight: 600; background: var(--track); border-radius: 6px; padding: 1px 8px; color: var(--ink); }

  aside { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .panel { background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .panel h2 { margin: 0; font: 700 22px/1.2 var(--display); }
  .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .close { border: 0; background: var(--track); border-radius: 999px; min-width: 40px; min-height: 40px; font-size: 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
  .stats div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
  .stats strong { display: block; font: 800 24px/1.1 var(--display); color: var(--ink); }
  ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.plain li { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  ul.plain li:first-child { border-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .txt { font-size: 15px; line-height: 1.4; color: var(--ink); text-decoration: none; }
  a.txt:hover { text-decoration: underline; }
  li.fresh { background: color-mix(in srgb, var(--loop) 8%, transparent); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--loop); color: var(--on-loop); text-decoration: none; font-weight: 600; margin-top: 12px; }
  .banner { background: var(--banner-bg); color: var(--reported); padding: 10px 40px; font-size: 14px; }
  .footnote { font-size: 14px; color: var(--muted); max-width: 80ch; margin: 18px 2px 0; }
  .loading { padding: 64px 32px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .banner { padding: 10px 16px; }
    .status { margin-left: 0; }
    .cartouche { top: 8px; left: 8px; padding: 4px 10px 4px 4px; gap: 8px; }
    .cartouche small, .cartouche .kick { display: none; }
    .cartouche strong { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading the live map…</p></div>
<script>window.itlLive = (demo) => import('./src/static.js?v=be3e94bf48').then((m) => m.initLive({ demo }));</script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const state = {
    view: params.get('view') || 'world', // "world" or a region id; checked once regions load
    window: ['1h', '6h', '24h'].includes(params.get('window')) ? params.get('window') : '6h',
    area: params.get('area') || null,
    demo: params.has('demo'),
    conn: 'connecting',
    fresh: new Set(),   // post uris that arrived live, highlighted for a while
    flashes: new Set(), // area ids to flash on the next render
    api: null,
    data: null,
    bg: null,        // backgrounders.json: the broad story of each region
    flying: false,   // a zoom animation is running; renders wait for it
    arrive: true,    // pop the bubbles in on the next render
  };
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOURS = { '1h': 1, '6h': 6, '24h': 24 };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(u || '') ? esc(u) : '#');
  const oneLine = (t, n = 200) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const STATUS = { corroborated: 'Confirmed', official: 'Official', reported: 'Reported once', disputed: 'Sources disagree', quiet: 'Quiet' };
  const COLOR = { corroborated: 'var(--confirmed)', reported: 'var(--reported-dot)', disputed: 'var(--disputed)', quiet: 'var(--muted)' };
  const paceText = (a) => (a.pace == null ? '' : `${a.pace}× usual`);
  // Needs history to compare with: the 24h window has none, so nothing pulses there.
  const isHot = (a) => a.count >= 3 && a.pace != null && a.pace >= 1.5;

  function urlFor(view) {
    const q = new URLSearchParams();
    if (view !== 'world') q.set('view', view);
    if (state.window !== '6h') q.set('window', state.window);
    if (state.area) q.set('area', state.area);
    if (state.demo) q.set('demo', '1');
    return `${location.pathname}${q.size ? `?${q}` : ''}`;
  }
  const syncUrl = () => history.replaceState(null, '', urlFor(state.view));

  const regions = () => state.api.live.regions();
  const mapOf = (view) => (view === 'world' ? 'world' : regions().find((r) => r.id === view)?.map || 'world');

  // Push overlapping bubbles apart; each keeps a dashed line to its real spot.
  function layout(areas, view) {
    const m = state.api.maps[view];
    const max = Math.max(1, ...areas.map((a) => a.count));
    const top = view === 'world' ? 44 : 70;
    const nodes = areas.map((a) => {
      const [x0, y0] = state.api.project(m, a.place.lon, a.place.lat);
      const r = a.count ? 12 + (top - 12) * Math.sqrt(a.count / max) : 7;
      // R: room for the bubble and its two-line label underneath
      return { a, x0, y0, x: x0, y: y0, r, R: view === 'world' ? Math.max(r + 30, 44) : Math.max(r + 16, 44) };
    });
    for (let it = 0; it < 240; it++) {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const p = nodes[i], q = nodes[j];
          let dx = q.x - p.x, dy = q.y - p.y;
          let d = Math.hypot(dx, dy);
          const min = p.R + q.R;
          if (d >= min) continue;
          if (d < 0.01) { dx = Math.cos(i + j); dy = Math.sin(i + j); d = 1; }
          const push = (min - d) / 2;
          const wp = q.R / (p.R + q.R), wq = p.R / (p.R + q.R); // small bubbles move more
          p.x -= (dx / d) * push * 2 * wp; p.y -= (dy / d) * push * 2 * wp;
          q.x += (dx / d) * push * 2 * wq; q.y += (dy / d) * push * 2 * wq;
        }
      }
      for (const n of nodes) {
        n.x += (n.x0 - n.x) * 0.03; n.y += (n.y0 - n.y) * 0.03;
        n.x = Math.min(m.width - n.r - 2, Math.max(n.r + 2, n.x));
        n.y = Math.min(m.height - n.r - 30, Math.max(n.r + 2, n.y));
      }
    }
    return nodes;
  }

  function mapSvg(d) {
    const mapId = mapOf(state.view);
    const m = state.api.maps[mapId];
    const nodes = layout(d.areas, mapId);
    // Keep labels readable when the map is drawn small (phones).
    const k = Math.min(2.6, Math.max(1, 720 / (document.querySelector('.map')?.clientWidth || window.innerWidth)));
    const bg = state.bg?.regions?.[state.view];
    const cls = (name) => (bg?.focus?.includes(name) ? 'country focus' : bg?.watch?.includes(name) ? 'country watch' : 'country');
    const countries = m.countries.map((c) => `<path class="${cls(c.name)}" d="${c.d}"><title>${esc(c.name)}</title></path>`).join('');
    const frames = mapId === 'world'
      ? regions().map((r) => { const b = boxOf(r.id); return `<rect class="frame" data-frame="${esc(r.id)}" x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}" rx="6"/>`; }).join('')
      : '';
    const extras = mapId === 'world' ? frames : graticule(m) + (bg?.labels || []).map((l) => {
      const [x, y] = state.api.project(m, l.lon, l.lat);
      return `<text class="clabel" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" style="font-size:${(l.size || 15) * Math.min(k, 1.6)}px">${esc(l.text.toUpperCase())}</text>`;
    }).join('');
    const leaders = nodes.filter((n) => Math.hypot(n.x - n.x0, n.y - n.y0) > n.r * 0.6)
      .map((n) => `<line class="leader" x1="${n.x0.toFixed(1)}" y1="${n.y0.toFixed(1)}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}"/><circle class="anchor" cx="${n.x0.toFixed(1)}" cy="${n.y0.toFixed(1)}" r="3"/>`).join('');
    const order = [...nodes].sort((p, q) => q.r - p.r); // big ones underneath
    const bubbles = order.map((n, i) => {
      const a = n.a;
      const st = a.count ? a.status : 'quiet';
      const c = COLOR[st] || COLOR.reported;
      const x = n.x.toFixed(1), y = n.y.toFixed(1);
      const label = `${a.region ? 'Zoom into ' : ''}${a.label}: ${plural(a.count, 'item')} in the last ${state.window}${a.pace == null ? '' : `, ${paceText(a)}`}, ${STATUS[st]}`;
      const ring = isHot(a) ? `<circle class="ring" cx="${x}" cy="${y}" r="${n.r.toFixed(1)}" style="stroke:${c}"/>` : '';
      const flash = state.flashes.has(a.id) ? `<circle class="flash" cx="${x}" cy="${y}" r="${n.r.toFixed(1)}"/>` : '';
      const ly = n.y + n.r + 16 * k;
      const meta = a.count ? `<text class="meta" style="font-size:${13 * k}px" x="${x}" y="${(ly + 15 * k).toFixed(1)}" text-anchor="middle">${plural(a.count, 'item')}${a.pace == null ? '' : ` · ${esc(paceText(a))}`}</text>` : '';
      return `<g class="bubble${a.count ? '' : ' quiet'}${state.area === a.id ? ' sel' : ''}" data-area="${esc(a.id)}" style="--i:${order.length - 1 - i}" tabindex="0" role="button" aria-label="${esc(label)}">
        ${ring}<circle class="disc" cx="${x}" cy="${y}" r="${n.r.toFixed(1)}" style="fill:color-mix(in srgb, ${c} ${a.count ? 30 : 12}%, transparent);stroke:${c}${a.count ? '' : ';stroke-dasharray:3 3'}"/>${flash}
        <text class="name" style="font-size:${(a.count ? 15 : 13) * k}px" x="${x}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(a.label)}</text>${meta}
      </g>`;
    }).join('');
    state.flashes.clear();
    return `<svg viewBox="0 0 ${m.width} ${m.height}" role="group" aria-label="Map of ${esc(m.label)} with one bubble per place">${countries}${extras}${leaders}${bubbles}</svg>`;
  }

  // Dashed lines every 5 degrees, the atlas feel of a zoomed-in view.
  function graticule(m) {
    const P = (lon, lat) => state.api.project(m, lon, lat);
    let d = '';
    for (let lon = Math.ceil(m.west / 5) * 5; lon <= m.east; lon += 5) { const [x0, y0] = P(lon, m.north), [, y1] = P(lon, m.south); d += `M${x0.toFixed(1)} ${y0.toFixed(1)}V${y1.toFixed(1)}`; }
    for (let lat = Math.ceil(m.south / 5) * 5; lat <= m.north; lat += 5) { const [x0, y] = P(m.west, lat), [x1] = P(m.east, lat); d += `M${x0.toFixed(1)} ${y.toFixed(1)}H${x1.toFixed(1)}`; }
    return `<path class="grat" d="${d}"/>`;
  }

  /** A view's area in world-map pixels: the whole world, or a region's lon/lat box. */
  function boxOf(view) {
    const W = state.api.maps.world;
    if (view === 'world') return { x: 0, y: 0, w: W.width, h: W.height };
    const v = state.api.maps[mapOf(view)];
    const [x0, y0] = state.api.project(W, v.west, v.north);
    const [x1, y1] = state.api.project(W, v.east, v.south);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  /** Grow a box around its centre to a width/height ratio, so it fills the frame. */
  function fit(b, aspect) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const w = b.w / b.h < aspect ? b.h * aspect : b.w;
    const h = w / aspect;
    return { x: cx - w / 2, y: cy - h / 2, w, h };
  }
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

  // The camera flies over the world map from one view's box to the other's,
  // while the frame changes shape to the new map's proportions.
  function fly(from, to) {
    const el = document.querySelector('.map');
    if (!el || reduceMotion()) return Promise.resolve();
    state.flying = true;
    el.classList.add('leaving');
    return new Promise((done) => setTimeout(() => {
      const W = state.api.maps.world;
      const target = state.api.maps[mapOf(to)];
      const width = el.clientWidth, h0 = el.clientHeight;
      const h1 = (width * target.height) / target.width;
      const A = fit(boxOf(from), width / h0), B = fit(boxOf(to), width / h1);
      const bg = to === 'world' ? null : state.bg?.regions?.[to];
      const cls = (name) => (bg?.focus?.includes(name) ? 'country focus' : bg?.watch?.includes(name) ? 'country watch' : 'country');
      el.style.height = `${h0}px`;
      el.className = 'map flying';
      el.innerHTML = `<svg viewBox="${A.x} ${A.y} ${A.w} ${A.h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${W.countries.map((c) => `<path class="${cls(c.name)}" d="${c.d}"/>`).join('')}</svg>`;
      const svg = el.firstElementChild;
      el.getBoundingClientRect();
      el.style.height = `${h1}px`;
      if (to !== 'world') el.classList.add('zoomed'); // tints the countries in as we fly
      const t0 = performance.now(), D = 950;
      const step = (now) => {
        const t = Math.min(1, (now - t0) / D), e = ease(t);
        const w = A.w * (B.w / A.w) ** e, h = A.h * (B.h / A.h) ** e; // zoom at an even pace
        const cx = A.x + A.w / 2 + (B.x + B.w / 2 - A.x - A.w / 2) * e;
        const cy = A.y + A.h / 2 + (B.y + B.h / 2 - A.y - A.h / 2) * e;
        svg.setAttribute('viewBox', `${cx - w / 2} ${cy - h / 2} ${w} ${h}`);
        if (t < 1) requestAnimationFrame(step); else { state.flying = false; done(); }
      };
      requestAnimationFrame(step);
    }, 200));
  }

  async function go(to, { push = true } = {}) {
    if (!to || to === state.view || state.flying) return;
    if (push) history.pushState({ view: to }, '', urlFor(to));
    const from = state.view;
    state.area = null;
    await fly(from, to);
    state.view = to;
    state.arrive = true;
    refresh();
    document.querySelector('.map')?.focus({ preventScroll: true });
  }

  function cartouche() {
    if (state.view === 'world') return '';
    const r = regions().find((x) => x.id === state.view);
    const bg = state.bg?.regions?.[state.view];
    return `<div class="cartouche"><button class="back" data-view="world" aria-label="Zoom out to the world map">← World</button><div><span class="kick">Zoomed in</span><strong>${esc(r?.label || '')}</strong>${bg?.kicker ? `<small>${esc(bg.kicker)}</small>` : ''}</div></div>`;
  }

  const dateText = (iso) => {
    const [y, mo, d] = String(iso).split('-').map(Number);
    const month = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][(mo || 1) - 1];
    return d ? `${d} ${month} ${y}` : mo ? `${month} ${y}` : String(y);
  };
  // "4 years, 9 months": how long it has been going, worked out on the day you look.
  function howLong(iso) {
    const s = new Date(`${iso}T00:00:00Z`), n = new Date();
    let months = (n.getUTCFullYear() - s.getUTCFullYear()) * 12 + n.getUTCMonth() - s.getUTCMonth() - (n.getUTCDate() < s.getUTCDate() ? 1 : 0);
    if (months < 1) return `${Math.max(1, Math.round((n - s) / 86_400_000))} days`;
    const y = Math.floor(months / 12); months %= 12;
    return [y && plural(y, 'year'), months && plural(months, 'month')].filter(Boolean).join(', ');
  }

  function background() {
    const bg = state.bg?.regions?.[state.view];
    if (!bg) return '';
    const label = (id) => state.data.areas.find((a) => a.id === id)?.label;
    const conflicts = bg.conflicts.map((c, i) => `<details class="conflict"${i === 0 ? ' open' : ''}>
        <summary><span class="ctitle">${esc(c.title)}</span><span class="since">${c.since ? `Since ${esc(dateText(c.since))} · ${esc(howLong(c.since))}` : esc(c.sinceText || '')}</span></summary>
        <h3>How it started</h3>${c.started.map((t) => `<p>${esc(t)}</p>`).join('')}
        <h3>What each side wants</h3><dl class="sides">${c.goals.map((g) => `<dt>${esc(g.side)}</dt><dd>${esc(g.text)}</dd>`).join('')}</dl>
        ${c.figures.length ? `<h3>By the numbers</h3><div class="figs">${c.figures.map((f) => `<div class="fig"><strong>${esc(f.value)}</strong><span>${esc(f.label)}</span><a href="${safeUrl(f.url)}" target="_blank" rel="noopener">${esc(f.source)}, ${esc(dateText(f.asOf))}</a></div>`).join('')}</div>` : ''}
        <h3>Key dates</h3><ol class="tl">${c.timeline.map((t) => `<li><time datetime="${esc(t.date)}">${esc(dateText(t.date))}</time>${esc(t.text)}</li>`).join('')}</ol>
        <h3>Why it's on the map now</h3><p class="now">${esc(c.now)}</p>
        ${c.places?.some(label) ? `<div class="chips" aria-label="Places on the map">${c.places.filter(label).map((p) => `<button data-pick="${esc(p)}">${esc(label(p))}</button>`).join('')}</div>` : ''}
      </details>`).join('');
    return `<section class="panel bg" aria-labelledby="bgh">
      <p class="eyebrow">Background · start here</p>
      <h2 id="bgh">${esc(bg.title)}</h2>
      <p class="lede">${esc(bg.lede)}</p>
      ${conflicts}
      <p class="fine">Written by In the Loop on ${esc(dateText(state.bg.reviewed))} from the sources linked, and updated by hand. Figures are the latest we found that day, not live. Death tolls in wars are hard to verify and sources count differently, so we name who counted.</p>
    </section>`;
  }

  function regionList() {
    if (!state.bg) return '';
    const items = regions().filter((r) => state.bg.regions[r.id]).map((r) => `<li><button data-view="${esc(r.id)}"><strong>${esc(r.label)}</strong><span>${esc(state.bg.regions[r.id].teaser)}</span></button></li>`).join('');
    return `<section class="panel" aria-labelledby="rh"><p class="eyebrow">New here?</p><h2 id="rh">The regions we follow</h2><ul class="regionlist">${items}</ul><p class="fine">Pick one to zoom in and read how it started, what each side wants and why it's on the map now.</p></section>`;
  }

  function detail(d) {
    const a = d.areas.find((x) => x.id === state.area);
    if (!a) return '';
    const st = a.count ? a.status : 'quiet';
    const stories = a.storylines.length
      ? `<ul class="plain">${a.storylines.map((s) => `<li>
          <div class="row"><span class="chip c-${esc(s.status)}">${esc(STATUS[s.status] || s.status)}</span><span>${esc(ago(s.firstSeen))}</span><span>${plural(s.posts, 'item')}${s.articles ? ` (${s.articles} ${s.articles === 1 ? 'article' : 'articles'})` : ''}${s.sources.length ? ` · ${esc(s.sources.slice(0, 3).join(', '))}` : ''}</span></div>
          <a class="txt" href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(oneLine(s.text, 220))}</a>
        </li>`).join('')}</ul>`
      : `<p class="muted" style="margin:0">Nothing from tracked voices in the last ${esc(state.window)}.</p>`;
    return `<section class="panel" aria-labelledby="dh">
      <div class="phead"><h2 id="dh">${esc(a.label)}</h2><button class="close" id="close" aria-label="Close ${esc(a.label)}">×</button></div>
      <div class="stats">
        <div><strong>${a.count}</strong>posts and articles in ${esc(state.window)}</div>
        <div><strong>${a.pace == null ? '–' : `${a.pace}×`}</strong>${a.pace == null ? 'no earlier posts' : 'its usual pace'}</div>
        <div><strong>${a.voices}</strong>${a.voices === 1 ? 'outlet' : 'outlets'}</div>
      </div>
      <div class="row" style="margin-bottom:8px"><span class="chip c-${st}">${esc(STATUS[st])}</span><span>overall, by share of posts</span></div>
      ${stories}
      <a class="btn" href="index.html?node=${encodeURIComponent(a.id)}&since=24h${state.demo ? '&demo=1' : ''}">Open the ${esc(a.label)} briefing</a>
    </section>`;
  }

  function feed(d) {
    const label = (id) => d.areas.find((a) => a.id === id)?.label;
    const items = d.feed.slice(0, 12);
    return `<section class="panel" aria-labelledby="fh">
      <div class="phead"><h2 id="fh">Just in</h2><span class="muted" style="font-size:13px">newest first</span></div>
      ${items.length ? `<ul class="plain" style="margin-top:8px">${items.map((p) => `<li class="${state.fresh.has(p.uri) ? 'fresh' : ''}">
        <div class="row"><strong style="color:var(--ink)">${esc(ago(p.at))}</strong>${label(p.area) ? `<span class="area-tag">${esc(label(p.area))}</span>` : `<span class="area-tag">${esc(p.topicLabel)}</span>`}<span>${esc(p.who)}${p.stateAffiliated ? ' (state)' : ''}</span>${p.news ? '<span class="area-tag news-tag">Article</span>' : ''}${state.fresh.has(p.uri) ? '<strong style="color:var(--loop)">Live</strong>' : ''}</div>
        <a class="txt" href="${safeUrl(p.url)}" target="_blank" rel="noopener">${esc(oneLine(p.text))}</a>
      </li>`).join('')}</ul>` : '<p class="muted" style="margin:8px 0 0">Nothing from tracked voices in the last day.</p>'}
    </section>`;
  }

  function statusText(d) {
    if (state.demo) return 'Demo · no live feed';
    if (state.conn === 'open') return `<strong style="color:var(--ink)">Live</strong> · following ${plural(d.voices, 'voice')}`;
    if (state.conn === 'reconnecting') return 'Reconnecting…';
    return 'Connecting…';
  }

  function render() {
    if (state.flying) return;
    const d = state.data;
    const app = document.getElementById('app');
    const active = d.areas.filter((a) => a.count);
    const hot = d.areas.filter(isHot).map((a) => a.label);
    const world = state.view === 'world';
    const sub = active.length
      ? `${plural(active.reduce((s, a) => s + a.count, 0), 'item')} from tracked voices and outlets in the last ${state.window} across ${plural(active.length, world ? 'region' : 'place')}.${hot.length ? ` Busier than usual: ${esc(hot.join(', '))}.` : ''}`
      : `No posts or articles from tracked voices in the last ${state.window}.`;
    const focused = document.activeElement?.dataset?.area;
    app.innerHTML = `
      ${state.demo ? '<div class="banner" role="status">Demo mode: made-up sample posts from fictional accounts, run through the real pipeline.</div>' : ''}
      <div class="wrap">
        <header class="top">
          <a class="brand" href="index.html${state.demo ? '?demo=1' : ''}" title="Go to the home page"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--track)" stroke-width="4"/><path d="M14 4a10 10 0 0 1 9.5 13" fill="none" stroke="var(--loop)" stroke-width="4" stroke-linecap="round"/></svg>in the loop</a>
          <nav class="crumbs" aria-label="Topic path"><span>Politics</span><span aria-hidden="true">/</span><span>Geopolitics</span><span aria-hidden="true">/</span>${world ? '<span class="here">World</span>' : `<span class="here">${esc(d.node.label)}</span>`}</nav>
          <nav class="tabs" aria-label="View"><a href="index.html?node=${encodeURIComponent(world ? 'geopolitics' : d.node.id)}${state.demo ? '&demo=1' : ''}">Briefing</a><a href="#" aria-current="page">Live map</a></nav>
          <div class="status ${state.conn === 'open' && !state.demo ? 'on' : ''}" role="status"><span class="pulse-dot" aria-hidden="true"></span><span>${statusText(d)}</span></div>
        </header>
        <div class="bar">
          <div><h1>${world ? "What's moving around the world" : `What's moving in ${d.node.id === 'middle-east' ? 'the ' : ''}${esc(d.node.label)}`}</h1><p class="sub">${sub} Bubble size is posts and articles; colour is where the main stories stand.</p></div>
          <div class="controls">
            <div class="seg" role="group" aria-label="Map">${[['world', 'World'], ...regions().map((r) => [r.id, r.label])].map(([k, l]) => `<button data-view="${k}" aria-pressed="${k === state.view}">${l}</button>`).join('')}</div>
            <div class="seg" role="group" aria-label="Time window">${Object.keys(HOURS).map((w) => `<button data-window="${w}" aria-pressed="${w === state.window}">Last ${w}</button>`).join('')}</div>
          </div>
        </div>
        <div class="layout">
          <div class="mapcol">
            <div class="map${world ? '' : ' zoomed'}${state.arrive && !reduceMotion() ? ' arrive' : ''}" tabindex="-1">${mapSvg(d)}${cartouche()}</div>
            <div class="legend">
              <span><i class="sw c-corroborated"></i>Mostly confirmed</span>
              <span><i class="sw c-reported"></i>Mostly reported once</span>
              <span><i class="sw c-disputed"></i>Sources disagree</span>
              <span><i class="sw c-quiet" style="background:none;border:2px dashed var(--muted)"></i>Quiet</span>
              <span>Pulsing ring: at least 1.5× its usual pace</span>
            </div>
            ${world ? `<p class="footnote">One bubble per tracked region: ${esc(regions().map((r) => r.label).join(', '))}. Click a bubble to zoom in. More regions come with more voices and keywords.</p>` : ''}
            <p class="footnote">Counts are posts from the ${plural(d.voices, 'tracked voice')} on Bluesky${d.articles ? ` plus ${plural(d.articles, 'news article')} from ${plural(d.outlets, 'outlet')}` : ''} that match each place's keywords, compared with their pace over the last 24 hours. New posts arrive live from Bluesky; news articles come from outlets' RSS feeds and GDELT every 15 minutes${d.newsUpdatedAt ? ` (last ${esc(ago(d.newsUpdatedAt))})` : ''}. In the Loop only reads Bluesky and never posts. Map: Natural Earth.</p>
            ${d.errors?.length ? `<details class="footnote"><summary>${plural(d.errors.length, 'warning')}</summary><ul>${d.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
          </div>
          <aside>${world ? regionList() : detail(d) + background()}${feed(d)}</aside>
        </div>
      </div>`;

    state.arrive = false;
    app.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));
    app.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => { state.area = b.dataset.pick; refresh(); app.querySelector('.map')?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }); }));
    const frame = (id, on) => app.querySelector(`.frame[data-frame="${CSS.escape(id)}"]`)?.classList.toggle('on', on);
    app.querySelectorAll('[data-window]').forEach((b) => b.addEventListener('click', () => { state.window = b.dataset.window; refresh(); }));
    app.querySelectorAll('.bubble').forEach((g) => {
      const pick = () => {
        if (state.view === 'world') { go(g.dataset.area); return; }
        state.area = state.area === g.dataset.area ? null : g.dataset.area; refresh(); app.querySelector(`.bubble[data-area="${CSS.escape(g.dataset.area)}"]`)?.focus();
      };
      g.addEventListener('click', pick);
      for (const [ev, on] of [['mouseenter', true], ['mouseleave', false], ['focus', true], ['blur', false]]) g.addEventListener(ev, () => frame(g.dataset.area, on));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
    app.querySelector('#close')?.addEventListener('click', () => { state.area = null; refresh(); });
    if (focused) app.querySelector(`.bubble[data-area="${CSS.escape(focused)}"]`)?.focus();
  }

  function refresh() {
    syncUrl();
    state.data = state.api.live.view({ now: new Date(), windowHours: HOURS[state.window], region: state.view });
    render();
  }

  async function start() {
    try {
      state.api = await window.itlLive(state.demo);
      const bgLoad = fetch('backgrounders.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
      await state.api.live.load();
      state.bg = await bgLoad;
      if (!regions().some((r) => r.id === state.view)) state.view = 'world';
      refresh();
      const follow = () => state.api.follow({
        onPost: (post) => {
          if (!state.api.live.add(post)) return;
          state.fresh.add(post.uri);
          const v = state.api.live.view({ now: new Date(), windowHours: HOURS[state.window], region: state.view });
          const hit = v.feed.find((p) => p.uri === post.uri);
          if (hit?.area) state.flashes.add(hit.area);
          refresh();
        },
        onStatus: (s) => { state.conn = s.type; if (state.data) render(); },
      });
      let sub = follow();
      window.addEventListener('popstate', () => {
        const v = new URLSearchParams(location.search).get('view') || 'world';
        go(regions().some((r) => r.id === v) ? v : 'world', { push: false });
      });
      setInterval(refresh, 60_000); // keep "x min ago" and the window current
      let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
      setInterval(async () => { // full reload: engagement counts, missed posts
        try { await state.api.live.load(); sub?.close(); sub = follow(); refresh(); } catch {}
      }, 10 * 60_000);
    } catch (err) {
      document.getElementById('app').innerHTML = `<p class="loading">Could not load the live map: ${esc(err.message)}</p>`;
    }
  }
  if (!window.itlLive) {
    document.getElementById('app').innerHTML = '<p class="loading">The live map runs in the static build. Run <code>npm run build:site</code> and open _site/live.html through any static web server.</p>';
  } else start();
})();
</script>
</body>
</html>
