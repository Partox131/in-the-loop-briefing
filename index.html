<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In the Loop</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #17181c; --muted: #55585f; --line: #e3e1da; --soft: #efede7;
    --accent: #1d4fb8; --bar: #c9d5ef;
    --disputed-bg: #f6e3fb; --disputed: #6a2b8f;
    --corroborated-bg: #dff1e7; --corroborated: #1f6b45;
    --reported-bg: #fdf0d5; --reported: #7a4a00;
    --official-bg: #dcf0f2; --official: #0f6e7a;
    --warn: #8a3b00;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316; --card: #1b1c20; --ink: #ececee; --muted: #a5a8b0; --line: #2d2f35; --soft: #24262b;
      --accent: #8fb0ff; --bar: #34446b;
      --disputed-bg: #3a2547; --disputed: #e2b8f7;
      --corroborated-bg: #1c3a2b; --corroborated: #9fdcba;
      --reported-bg: #3d2f12; --reported: #f3cf8a;
      --official-bg: #173a3e; --official: #9adbe3;
      --warn: #f3b07a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  a { color: var(--accent); }
  header.top { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between; padding: 14px 32px; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 22px; }
  nav.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
  nav.crumbs a { color: var(--muted); text-decoration: none; }
  nav.crumbs a:hover { color: var(--ink); text-decoration: underline; }
  nav.crumbs .here { color: var(--ink); font-weight: 600; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; min-height: 36px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
  main { display: flex; flex-wrap: wrap; gap: 32px; padding: 28px 32px 48px; max-width: 1320px; margin: 0 auto; }
  .col { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  aside { flex: 1 1 320px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-family: var(--serif); font-size: 40px; line-height: 1.1; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--reported-bg); color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .since { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; align-items: baseline; }
  .since .tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .tag.new { color: var(--accent); } .tag.corroborated, .tag.official { color: var(--corroborated); } .tag.disputed { color: var(--disputed); }
  .lenses { display: flex; flex-wrap: wrap; gap: 8px; }
  .lenses button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; min-height: 40px; }
  .lenses button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  article.story { display: flex; flex-direction: column; gap: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .status { font-weight: 700; font-size: 12px; letter-spacing: .03em; border-radius: 6px; padding: 3px 8px; }
  .status.disputed { background: var(--disputed-bg); color: var(--disputed); }
  .status.corroborated { background: var(--corroborated-bg); color: var(--corroborated); }
  .status.reported { background: var(--reported-bg); color: var(--reported); }
  .status.official { background: var(--official-bg); color: var(--official); }
  .newdot { color: var(--accent); font-weight: 700; }
  .lead { margin: 0; font-family: var(--serif); font-size: 22px; line-height: 1.3; font-weight: 600; }
  .lead a { color: inherit; text-decoration: none; } .lead a:hover { text-decoration: underline; }
  .by { font-size: 13px; color: var(--muted); }
  .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .side { background: var(--soft); border-radius: 10px; padding: 12px 14px; }
  .side .num { font-size: 22px; font-weight: 700; }
  .push { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  details .rel { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 80px; }
  .spark div { flex: 1; background: var(--bar); border-radius: 2px; min-height: 2px; }
  .spark div.hot { background: var(--accent); }
  .cov { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) 40px; gap: 8px 10px; align-items: center; font-size: 13px; }
  .cov .bar { height: 10px; background: var(--accent); border-radius: 5px; }
  ol.dev { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  ol.dev li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
  .muted { color: var(--muted); }
  .banner { background: var(--reported-bg); color: var(--reported); padding: 10px 32px; font-size: 14px; }
  .notes { font-size: 13px; color: var(--muted); }
  .loading { padding: 64px 32px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) {
    header.top, main { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 32px; }
    .since { grid-template-columns: 1fr; gap: 2px 0; }
    .since .tag { margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading the latest from Bluesky…</p></div>
<script>window.itlStatic = import('./src/static.js').then((m) => m.init());</script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const state = { node: params.get('node') || '', since: params.get('since') || '24h', lens: 'all', data: null, baseline: null, demo: params.has('demo') };
  const href = (node) => `?node=${encodeURIComponent(node)}&since=${state.since}${state.demo ? '&demo=1' : ''}`;
  const LENSES = [['all', 'All'], ['military', 'Military'], ['diplomacy', 'Diplomacy'], ['economy', 'Economy and energy'], ['humanitarian', 'Humanitarian']];
  const WINDOWS = ['6h', '12h', '24h', '48h', '7d'];
  const STATUS_LABEL = { disputed: 'DISPUTED', corroborated: 'CORROBORATED', reported: 'REPORTED', official: 'OFFICIAL' };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(u || '') ? esc(u) : '#');
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  };
  const clock = (iso) => {
    const d = new Date(iso);
    return Date.now() - d < 86400000 ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { weekday: 'short' });
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const oneLine = (t, n = 220) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const title = (t) => oneLine(String(t || '').split(/(?<=[.!?])\s/)[0], 140);

  // "Since you last checked" lives in this browser only.
  const storeKey = (node) => `itl:seen:${node}`;
  const loadSeen = (node) => { try { return JSON.parse(localStorage.getItem(storeKey(node))) || null; } catch { return null; } };
  const saveSeen = (node, d) => { try { localStorage.setItem(storeKey(node), JSON.stringify({ at: Date.now(), status: Object.fromEntries(d.stories.map((s) => [s.id, s.status])) })); } catch {} };

  function changes(d) {
    const seen = state.baseline;
    if (!seen) return { first: true, items: d.stories.slice(0, 3).map((s) => ({ tag: 'new', label: 'NEW', s })) };
    const items = [];
    for (const s of d.stories) {
      const before = seen.status[s.id];
      if (!before) items.push({ tag: 'new', label: 'NEW', s });
      else if (before !== s.status && s.status === 'disputed') items.push({ tag: 'disputed', label: 'SOURCES DISAGREE', s });
      else if (before !== s.status && (s.status === 'corroborated' || s.status === 'official')) items.push({ tag: s.status, label: 'NOW CONFIRMED', s });
    }
    return { first: false, at: seen.at, items };
  }

  function sinceBox(d) {
    const c = changes(d);
    const head = c.first ? 'Here is where things stand' : `Since you last checked <span class="muted" style="font-weight:400">· ${esc(ago(new Date(c.at).toISOString()))}</span>`;
    const rows = c.items.length
      ? `<div class="since">${c.items.map((i) => `<span class="tag ${i.tag}">${i.label}</span><span>${esc(title(i.s.lead.text))} <span class="muted">· ${plural(i.s.voiceCount, 'voice')}</span></span>`).join('')}</div>`
      : '<p style="margin:0" class="muted">Nothing new or changed.</p>';
    return `<section class="card" aria-labelledby="since"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><h2 id="since">${head}</h2>${c.first ? '' : '<button id="markread" style="border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;min-height:36px">Mark all as read</button>'}</div>${rows}</section>`;
  }

  function disagreement(x) {
    if (x.type === 'numbers') {
      return `<div><div class="by" style="margin-bottom:6px">Sources give different numbers (${esc(x.kind)})</div><div class="sides">${x.sides.map((s) => `<div class="side"><div class="num">${esc(s.value.toLocaleString())}</div><div style="font-size:14px">per ${esc(s.sources.join(', '))}</div><a href="${safeUrl(s.url)}" target="_blank" rel="noopener" style="font-size:13px">${esc(clock(s.at))} · source</a></div>`).join('')}</div></div>`;
    }
    return `<div class="push"><strong>${esc(x.from.affiliation)}</strong> pushes back on <strong>${esc(x.to.affiliation)}</strong>: “${esc(oneLine(x.from.text, 200))}” <a href="${safeUrl(x.from.url)}" target="_blank" rel="noopener">view</a></div>`;
  }

  function story(s, isNew) {
    const voice = s.lead.voice;
    const who = voice ? `${esc(voice.name)} · ${esc(voice.tier)}${voice.stateAffiliated ? ' · state-affiliated' : ''}` : `@${esc(s.lead.handle)}`;
    const lift = s.lead.why?.amplifiedBy ? ` · amplified by ${plural(s.lead.why.amplifiedBy, 'voice')}` : '';
    const c = s.lead.counts || {};
    const topic = s.topicId !== state.data.node.id ? ` · in ${esc(s.topicLabel)}` : '';
    const lenses = s.lenses.length ? ` · ${esc(s.lenses.join(', '))}` : '';
    const sources = s.sources.map((x) => `<span class="chip">${esc(x.affiliation)}${x.stateAffiliated ? ' · state' : ''}</span>`).join('');
    const related = s.related.length
      ? `<details><summary>${s.postCount - 1 > s.related.length ? `Top ${s.related.length} of ${s.postCount - 1} related posts` : plural(s.postCount - 1, 'related post')}</summary><div class="rel">${s.related.map((p) => `<div><strong>${esc(p.voice ? p.voice.name : '@' + p.handle)}</strong> <span class="muted">· ${esc(ago(p.createdAt))}</span><br>${esc(oneLine(p.text))} <a href="${safeUrl(p.url)}" target="_blank" rel="noopener">view</a></div>`).join('')}</div></details>`
      : '';
    return `<article class="card story">
      <div class="meta"><span class="status ${s.status}">${STATUS_LABEL[s.status]}</span>${isNew ? '<span class="newdot">New</span>' : ''}<span>first seen ${esc(ago(s.firstSeen))}${topic}${lenses} · ${plural(s.postCount, 'post')} from ${plural(s.voiceCount, 'voice')}</span></div>
      <p class="lead"><a href="${safeUrl(s.lead.url)}" target="_blank" rel="noopener">${esc(oneLine(s.lead.text, 280))}</a></p>
      <div class="by">${who} · ${esc(ago(s.lead.createdAt))} · ♥ ${c.likes ?? 0} · reposts ${c.reposts ?? 0} · replies ${c.replies ?? 0}${lift}</div>
      ${s.disagreements.map(disagreement).join('')}
      ${sources ? `<div class="chips">${sources}</div>` : ''}
      ${related}
    </article>`;
  }

  function rail(d) {
    const max = Math.max(1, ...d.activity.map((b) => b.count));
    const recent = d.activity.slice(-4).reduce((a, b) => a + b.count, 0) / 4;
    const before = d.activity.slice(0, -4).reduce((a, b) => a + b.count, 0) / Math.max(1, d.activity.length - 4);
    const spark = d.activity.map((b, i) => `<div class="${i >= d.activity.length - 4 && recent > before * 1.5 ? 'hot' : ''}" style="height:${Math.round((b.count / max) * 100)}%" title="${esc(clock(b.hour))}: ${b.count}"></div>`).join('');
    const cov = d.coverage.length
      ? `<div class="cov">${d.coverage.map((r) => `<span>${esc(r.region)}</span><div class="bar" style="width:${Math.max(4, Math.round(r.share * 100))}%"></div><span>${Math.round(r.share * 100)}%</span>`).join('')}</div>`
      : '<p class="muted" style="margin:0">No tracked voices yet.</p>';
    const thin = d.coverage.filter((r) => r.share < 0.1).map((r) => r.region);
    const dev = d.developments.length
      ? `<ol class="dev">${d.developments.map((x) => `<li><span class="muted">${esc(clock(x.at))}</span><a href="${safeUrl(x.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(title(x.text))}</a></li>`).join('')}</ol>`
      : '<p class="muted" style="margin:0">Nothing confirmed by two independent outlets yet.</p>';
    return `<aside>
      <section class="card"><h2>Activity, last 24 hours</h2><div class="spark" role="img" aria-label="On-topic posts per hour">${spark}</div><p class="notes" style="margin:10px 0 0">${recent > before * 1.5 ? `Up ${Math.round(recent / Math.max(before, 0.1))}× in the last 4 hours.` : 'No unusual spike.'}</p></section>
      <section class="card"><h2>Where coverage comes from</h2>${cov}${thin.length ? `<p class="notes" style="margin:10px 0 0;color:var(--warn)">Thin coverage from: ${esc(thin.join(', '))}.</p>` : ''}</section>
      <section class="card"><h2>Key developments</h2>${dev}</section>
    </aside>`;
  }

  function render() {
    const d = state.data;
    const app = document.getElementById('app');
    const crumbs = d.crumbs.map((c, i) => (i === d.crumbs.length - 1 ? `<span class="here">${esc(c.label)}</span>` : `<a href="${href(c.id)}">${esc(c.label)}</a><span aria-hidden="true">›</span>`)).join('');
    const seen = state.baseline;
    const visible = d.stories.filter((s) => state.lens === 'all' || s.lenses.includes(state.lens));
    const broader = d.parent ? `<a href="${href(d.parent.id)}">Show broader: ${esc(d.parent.label)}</a>` : '';
    const narrower = d.children.length ? ` · Narrower: ${d.children.map((c) => `<a href="${href(c.id)}">${esc(c.label)}</a>`).join(', ')}` : '';
    const spike = d.activity.slice(-4).reduce((a, b) => a + b.count, 0);
    app.innerHTML = `
      ${d.demo ? '<div class="banner" role="status">Demo mode: made-up sample posts from fictional accounts, run through the real pipeline. Live Bluesky data runs without demo mode.</div>' : ''}
      <header class="top">
        <div style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center"><span class="brand">In the Loop</span><nav class="crumbs" aria-label="Topic path">${crumbs}</nav></div>
        <div class="seg" role="group" aria-label="Time window">${WINDOWS.map((w) => `<button data-since="${w}" aria-pressed="${w === state.since}">${w}</button>`).join('')}</div>
      </header>
      <main>
        <div class="col">
          <section>
            <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><h1>${esc(d.node.label)}</h1>${spike ? `<span class="pill">${d.stories.length} storylines · ${d.stats.onTopic} posts</span>` : ''}</div>
            <p class="sub">Following ${d.stats.voices} voices · updated ${esc(ago(d.generatedAt))} · ${broader}${narrower}</p>
          </section>
          ${sinceBox(d)}
          <div class="lenses" role="group" aria-label="Lens">${LENSES.map(([k, l]) => `<button data-lens="${k}" aria-pressed="${k === state.lens}">${l}</button>`).join('')}</div>
          ${visible.length ? visible.map((s) => story(s, !seen || !seen.status[s.id])).join('') : '<div class="card muted">No storylines for this lens in this window.</div>'}
          <p class="notes">Ranked by engagement compared with each account's usual, boosted when other credible voices share or quote it. Corroborated = two independent outlets. Read-only: In the Loop never posts to Bluesky.</p>
          ${d.missingVoices.length ? `<p class="notes">Voices not found on Bluesky: ${esc(d.missingVoices.join(', '))}</p>` : ''}
          ${d.errors.length ? `<details class="notes"><summary>${d.errors.length} warnings</summary><ul>${d.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
        </div>
        ${rail(d)}
      </main>`;
    app.querySelectorAll('[data-lens]').forEach((b) => b.addEventListener('click', () => { state.lens = b.dataset.lens; render(); }));
    app.querySelectorAll('[data-since]').forEach((b) => b.addEventListener('click', () => { state.since = b.dataset.since; load(); }));
    const mr = app.querySelector('#markread');
    if (mr) mr.addEventListener('click', () => { saveSeen(d.node.id, d); state.baseline = loadSeen(d.node.id); render(); });
  }

  async function load() {
    const q = new URLSearchParams({ since: state.since });
    if (state.node) q.set('node', state.node);
    if (state.demo) q.set('demo', '1');
    history.replaceState(null, '', `?${q}`);
    try {
      let body;
      if (window.itlStatic) {
        // GitHub Pages build: the pipeline runs here in the browser (src/static.js).
        body = await (await window.itlStatic)({ node: state.node, since: state.since, demo: state.demo });
      } else {
        const res = await fetch(`/api/brief?${q}`);
        body = await res.json();
        if (!res.ok) throw new Error(body.error || res.statusText);
      }
      // Compare against what this browser saw last time; on a first visit, remember now.
      if (!state.data || state.data.node.id !== body.node.id) state.baseline = loadSeen(body.node.id);
      if (!state.baseline && !loadSeen(body.node.id)) saveSeen(body.node.id, body);
      state.data = body;
      state.node = body.node.id;
      render();
    } catch (err) {
      document.getElementById('app').innerHTML = `<p class="loading">Could not load the briefing: ${esc(err.message)}</p>`;
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
