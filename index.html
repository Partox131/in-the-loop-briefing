<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In the Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F8; --raise: #FFFFFF; --ink: #1D2147; --muted: #5B6080; --line: #E2E5EF; --track: #E2E5EF;
    --loop: #3047D6; --on-loop: #FFFFFF; --bars: #B9C1E6;
    --reported: #8A5608; --reported-dot: #C27A10;
    --confirmed: #0F6B5C; --disputed: #9B2C74; --new: #3047D6;
    --warn: #8A5608; --banner-bg: #FBEFD8;
    --display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r1: #3047D6; --r2: #0F6B5C; --r3: #C27A10; --r4: #9B2C74; --r5: #5B6080; --r6: #7C8BE8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142B; --raise: #1B1E3B; --ink: #E7E9F5; --muted: #A3A8C8; --line: #2C3056; --track: #2A2E52;
      --loop: #7C8FFF; --on-loop: #12142B; --bars: #4A5390;
      --reported: #F0C27A; --reported-dot: #E0A040;
      --confirmed: #7FD6C2; --disputed: #F0A8D6; --new: #9DB0FF;
      --warn: #F0C27A; --banner-bg: #3A2E14;
      --r1: #7C8FFF; --r2: #7FD6C2; --r3: #E0A040; --r4: #F0A8D6; --r5: #A3A8C8; --r6: #C2CAFF;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
  a { color: var(--loop); }
  :focus-visible { outline: 3px solid var(--loop); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header.top { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; justify-content: space-between; padding: 18px 56px; max-width: 1360px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 9px; font: 800 22px/1 var(--display); letter-spacing: -0.01em; }
  nav.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
  nav.crumbs a { color: var(--muted); text-decoration: none; }
  nav.crumbs a:hover { color: var(--ink); text-decoration: underline; }
  nav.crumbs .here { color: var(--ink); font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--track); border-radius: 999px; padding: 4px; }
  .tabs a { text-decoration: none; color: var(--muted); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; min-height: 40px; display: flex; align-items: center; }
  .tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .seg { display: flex; gap: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 10px 12px; min-height: 44px; border-radius: 999px; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  .hero { display: grid; grid-template-columns: minmax(260px, 420px) minmax(0, 1fr); gap: 24px 64px; align-items: center; padding: 16px 56px 40px; max-width: 1360px; margin: 0 auto; }
  .dial { width: 100%; height: auto; display: block; }
  .dial text { font-family: var(--body); fill: var(--muted); }
  .dial .big { font: 800 64px var(--display); fill: var(--ink); }
  h1 { margin: 0; font: 800 clamp(48px, 7vw, 80px)/1 var(--display); letter-spacing: -0.03em; }
  .sub { margin: 14px 0 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
  .sub a { color: inherit; }
  .since { margin-top: 26px; max-width: 640px; }
  .since h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .since ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 18px; }
  .since li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .since li strong { font-weight: 700; }
  .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { border: 0; background: var(--loop); color: var(--on-loop); border-radius: 999px; padding: 11px 20px; font-weight: 600; min-height: 44px; }
  .btn.quiet { background: var(--track); color: var(--ink); }

  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.new { background: var(--new); } .dot.reported { background: var(--reported-dot); }
  .dot.corroborated, .dot.official { background: var(--confirmed); } .dot.disputed { background: var(--disputed); }

  main { display: flex; flex-wrap: wrap; gap: 40px 64px; padding: 0 56px 64px; max-width: 1360px; margin: 0 auto; }
  .col { flex: 999 1 600px; min-width: 0; }
  aside { flex: 1 1 300px; display: flex; flex-direction: column; gap: 36px; padding-top: 8px; }
  .listhead { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 26px; }
  .listhead h2 { margin: 0; font: 600 30px/1.1 var(--display); }
  .lenses { display: flex; flex-wrap: wrap; gap: 8px; }
  .lenses button { border: 0; background: var(--track); color: var(--ink); border-radius: 999px; padding: 10px 16px; min-height: 44px; font-size: 15px; }
  .lenses button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  article.story { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  article.story:last-of-type { border-bottom: 0; }
  .state { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .state.reported { color: var(--reported); } .state.corroborated, .state.official { color: var(--confirmed); } .state.disputed { color: var(--disputed); }
  ol.rail { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; color: var(--muted); }
  ol.rail li { display: flex; gap: 10px; align-items: center; position: relative; }
  ol.rail li + li { margin-top: 18px; }
  ol.rail li + li::before { content: ''; position: absolute; left: 5px; top: -16px; width: 2px; height: 14px; background: var(--line); }
  .newtag { margin-top: 10px; display: inline-block; font-size: 13px; font-weight: 700; color: var(--new); }
  .story h3 { margin: 0; font: 600 25px/1.22 var(--display); letter-spacing: -0.01em; }
  .story h3 a { color: inherit; text-decoration: none; }
  .story h3 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .by { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
  .numbers { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 2px; background: var(--line); border: 2px solid var(--line); border-radius: 8px; overflow: hidden; max-width: 640px; }
  .numbers > div { background: var(--raise); padding: 14px 18px; }
  .numbers .num { font: 800 44px/1 var(--display); }
  .numbers .who { margin-top: 6px; font-size: 15px; }
  .numbers a { font-size: 14px; }
  .numcap { margin: 18px 0 0; font-size: 14px; color: var(--muted); }
  .numcap + .numbers { margin-top: 8px; }
  blockquote.push { margin: 18px 0 0; max-width: 640px; padding: 14px 18px; background: var(--raise); border-radius: 8px; font-size: 16px; }
  .sources { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  details { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--loop); font-weight: 600; font-size: 15px; min-height: 32px; display: flex; align-items: center; }
  details .rel { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; max-width: 68ch; }

  aside h2 { margin: 0 0 14px; font: 600 20px/1.2 var(--display); }
  .stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--track); }
  .legend { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .legend li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .notes { font-size: 14px; color: var(--muted); }
  .warn { color: var(--warn); }
  ol.dev { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
  ol.dev li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; }
  ol.dev a { color: inherit; text-decoration: none; } ol.dev a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .banner { background: var(--banner-bg); color: var(--reported); padding: 10px 56px; font-size: 14px; }
  .footnote { margin-top: 28px; font-size: 14px; color: var(--muted); max-width: 72ch; }
  .loading { padding: 64px 32px; text-align: center; color: var(--muted); }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .dial { max-width: 340px; margin: 0 auto; }
  }
  @media (max-width: 640px) {
    header.top, .hero, main { padding-left: 16px; padding-right: 16px; }
    .banner { padding: 10px 16px; }
    article.story { grid-template-columns: 1fr; }
    ol.rail { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    ol.rail li + li { margin-top: 0; }
    ol.rail li + li::before { display: none; }
  }
</style>
</head>
<body>
<div id="app"><p class="loading">Loading the latest from Bluesky…</p></div>
<script>window.itlStatic = import('./src/static.js?v=4d071d303c').then((m) => m.init());</script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const state = { node: params.get('node') || '', since: params.get('since') || '24h', lens: 'all', data: null, baseline: null, demo: params.has('demo') };
  const href = (node) => `?node=${encodeURIComponent(node)}&since=${state.since}${state.demo ? '&demo=1' : ''}`;
  const LENSES = [['all', 'Everything'], ['military', 'Military'], ['diplomacy', 'Diplomacy'], ['economy', 'Economy and energy'], ['humanitarian', 'Humanitarian']];
  const WINDOWS = ['6h', '12h', '24h', '48h', '7d'];

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https:\/\//.test(u || '') ? esc(u) : '#');
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  };
  const clock = (iso) => {
    const d = new Date(iso);
    return Date.now() - d < 86400000 ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { weekday: 'short' });
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const oneLine = (t, n = 220) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const title = (t) => oneLine(String(t || '').split(/(?<=[.!?])\s/)[0], 140);

  // "Since you last checked" lives in this browser only.
  const storeKey = (node) => `itl:seen:${node}`;
  const loadSeen = (node) => { try { return JSON.parse(localStorage.getItem(storeKey(node))) || null; } catch { return null; } };
  const saveSeen = (node, d) => { try { localStorage.setItem(storeKey(node), JSON.stringify({ at: Date.now(), status: Object.fromEntries(d.stories.map((s) => [s.id, s.status])) })); } catch {} };

  function changes(d) {
    const seen = state.baseline;
    if (!seen) return { first: true, items: d.stories.slice(0, 3).map((s) => ({ tag: 'new', s })) };
    const items = [];
    for (const s of d.stories) {
      const before = seen.status[s.id];
      if (!before) items.push({ tag: 'new', s });
      else if (before !== s.status && s.status === 'disputed') items.push({ tag: 'disputed', s });
      else if (before !== s.status && (s.status === 'corroborated' || s.status === 'official')) items.push({ tag: s.status, s });
    }
    return { first: false, at: seen.at, items };
  }

  const STATE_LABEL = { disputed: 'Sources disagree', corroborated: 'Confirmed', reported: 'Reported once', official: 'Official statement' };
  const KIND = { new: 'New', disputed: 'Disputed', corroborated: 'Confirmed', official: 'Confirmed' };
  const DAY = 86400000;

  // The 24-hour loop: now at the top, the past running anticlockwise.
  const angleOf = (t, now) => 360 - (Math.min(DAY, Math.max(0, now - t)) / DAY) * 360;
  const pt = (a, r) => { const t = (a * Math.PI) / 180; return [200 + r * Math.sin(t), 200 - r * Math.cos(t)].map((v) => v.toFixed(1)); };

  function dial(d, c) {
    const now = Date.parse(d.generatedAt);
    const max = Math.max(1, ...d.activity.map((b) => b.count));
    const bars = d.activity.map((b) => {
      const a = angleOf(Date.parse(b.hour) + 1800000, now);
      const len = b.count ? 6 + (b.count / max) * 44 : 0;
      if (!len) return '';
      const [x1, y1] = pt(a, 138); const [x2, y2] = pt(a, 138 - len);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bars)" stroke-width="6" stroke-linecap="round"/>`;
    }).join('');
    let arc = '';
    if (!c.first) {
      const span = Math.min(DAY, now - c.at);
      if (span >= DAY - 60000) arc = '<circle cx="200" cy="200" r="160" fill="none" stroke="var(--loop)" stroke-width="22"/>';
      else if (span > 0) {
        const [x, y] = pt(angleOf(c.at, now), 160);
        arc = `<path d="M${x} ${y} A160 160 0 ${span > DAY / 2 ? 1 : 0} 1 200 40" fill="none" stroke="var(--loop)" stroke-width="22" stroke-linecap="round"/>`;
      }
    }
    const dots = d.stories.filter((s) => now - Date.parse(s.firstSeen) < DAY).map((s) => {
      const [x, y] = pt(angleOf(Date.parse(s.firstSeen), now), 160);
      return `<circle cx="${x}" cy="${y}" r="9" fill="var(--${s.status === 'disputed' ? 'disputed' : s.status === 'reported' ? 'reported-dot' : 'confirmed'})" stroke="var(--bg)" stroke-width="3"><title>${esc(title(s.lead.text))}</title></circle>`;
    }).join('');
    const marks = [[6, '6h ago'], [12, '12h ago'], [18, '18h ago']].map(([h, l]) => {
      const [x, y] = pt(360 - h * 15, 194);
      return `<text x="${x}" y="${y}" font-size="13" text-anchor="middle" dominant-baseline="middle">${l}</text>`;
    }).join('');
    const count = c.first ? d.stories.length : c.items.length;
    const line1 = c.first ? (count === 1 ? 'storyline in the' : 'storylines in the') : (count === 1 ? 'change since you' : 'changes since you');
    const line2 = c.first ? 'last 24 hours' : `looked at ${esc(clock(new Date(c.at).toISOString()))}`;
    const label = c.first ? `${count} storylines in the last 24 hours.` : `${count} changes since you last looked, ${ago(new Date(c.at).toISOString())}.`;
    return `<svg class="dial" viewBox="-30 -30 460 460" role="img" aria-label="The last 24 hours as a loop, now at the top. ${esc(label)}">
      <circle cx="200" cy="200" r="160" fill="none" stroke="var(--track)" stroke-width="22"/>
      ${arc}${bars}${dots}${marks}
      <text x="200" y="12" font-size="13" text-anchor="middle" font-weight="600" style="fill:var(--ink)">Now</text>
      <text class="big" x="200" y="190" text-anchor="middle">${count}</text>
      <text x="200" y="222" font-size="17" text-anchor="middle">${line1}</text>
      <text x="200" y="244" font-size="17" text-anchor="middle">${line2}</text>
    </svg>`;
  }

  function sinceList(d, c) {
    const items = c.first ? d.stories.slice(0, 3).map((s) => ({ tag: s.status === 'disputed' ? 'disputed' : 'new', s })) : c.items;
    const head = c.first ? 'Where things stand' : `Since you last checked, ${esc(ago(new Date(c.at).toISOString()))}`;
    const rows = items.length
      ? `<ul>${items.map((i) => `<li><span class="dot ${i.tag}"></span><span><strong>${KIND[i.tag]}:</strong> ${esc(title(i.s.lead.text))}</span></li>`).join('')}</ul>`
      : '<p style="margin:0" class="muted">Nothing new or changed.</p>';
    return `<section class="since" aria-labelledby="since"><h2 id="since">${head}</h2>${rows}${c.first ? '' : '<div class="actions"><button class="btn quiet" id="markread">Mark all as read</button></div>'}</section>`;
  }

  function disagreement(x) {
    if (x.type === 'numbers') {
      return `<p class="numcap">Sources give different numbers (${esc(x.kind)})</p><div class="numbers">${x.sides.map((s) => `<div><div class="num">${esc(s.value.toLocaleString())}</div><div class="who">per ${esc(s.sources.join(', '))}</div><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(clock(s.at))}, view source</a></div>`).join('')}</div>`;
    }
    return `<blockquote class="push"><strong>${esc(x.from.affiliation)}</strong> pushes back on <strong>${esc(x.to.affiliation)}</strong>: “${esc(oneLine(x.from.text, 200))}” <a href="${safeUrl(x.from.url)}" target="_blank" rel="noopener">View post</a></blockquote>`;
  }

  // A small timeline of how the claim has moved so far.
  function rail(s) {
    const steps = [{ cls: 'reported', text: `Reported ${clock(s.firstSeen)}` }];
    const latestSide = s.disagreements.flatMap((x) => (x.type === 'numbers' ? x.sides.map((y) => y.at) : [])).sort().at(-1);
    if (s.status === 'disputed') steps.push({ cls: 'disputed', text: latestSide ? `Split ${clock(latestSide)}` : 'Challenged' });
    else if (s.status === 'corroborated') steps.push({ cls: 'corroborated', text: `${s.sources.length} outlets agree` });
    else if (s.status === 'official') steps.push({ cls: 'official', text: 'Officials confirm' });
    else if (now() - Date.parse(s.lastSeen) < DAY) steps.push({ cls: '', text: 'Waiting for a second source' });
    return `<ol class="rail">${steps.map((x) => `<li><span class="dot ${x.cls}"></span>${esc(x.text)}</li>`).join('')}</ol>`;
  }
  const now = () => Date.parse(state.data.generatedAt);

  function story(s, isNew) {
    const voice = s.lead.voice;
    const who = voice ? `${esc(voice.name)}${voice.stateAffiliated ? ' (state-affiliated)' : ''}` : `@${esc(s.lead.handle)}`;
    const lift = s.lead.why?.amplifiedBy ? `, shared by ${plural(s.lead.why.amplifiedBy, 'other voice')}` : '';
    const topic = s.topicId !== state.data.node.id ? ` In ${esc(s.topicLabel)}.` : '';
    const sources = s.sources.length ? `<p class="sources">Sources: ${s.sources.map((x) => `${esc(x.affiliation)}${x.stateAffiliated ? ' (state)' : ''}`).join(', ')}</p>` : '';
    const related = s.related.length
      ? `<details><summary>${s.postCount - 1 > s.related.length ? `Top ${s.related.length} of ${s.postCount - 1} related posts` : plural(s.postCount - 1, 'related post')}</summary><div class="rel">${s.related.map((p) => `<div><strong>${esc(p.voice ? p.voice.name : '@' + p.handle)}</strong> <span class="muted">${esc(ago(p.createdAt))}</span><br>${esc(oneLine(p.text))} <a href="${safeUrl(p.url)}" target="_blank" rel="noopener">View post</a></div>`).join('')}</div></details>`
      : '';
    return `<article class="story">
      <div><div class="state ${s.status}"><span class="dot ${s.status}"></span>${STATE_LABEL[s.status]}</div>${rail(s)}${isNew ? '<span class="newtag">New to you</span>' : ''}</div>
      <div>
        <h3><a href="${safeUrl(s.lead.url)}" target="_blank" rel="noopener">${esc(oneLine(s.lead.text, 280))}</a></h3>
        <p class="by">Led by ${who}, ${esc(ago(s.lead.createdAt))}${lift}. ${plural(s.postCount, 'post')} from ${plural(s.voiceCount, 'voice')}.${topic}</p>
        ${s.disagreements.map(disagreement).join('')}
        ${sources}
        ${related}
      </div>
    </article>`;
  }

  function side(d) {
    const colors = ['--r1', '--r2', '--r3', '--r4', '--r5', '--r6'];
    const col = (i) => `var(${colors[i % colors.length]})`;
    const cov = d.coverage.length
      ? `<div class="stack" role="img" aria-label="Share of posts by region">${d.coverage.map((r, i) => `<div style="width:${(r.share * 100).toFixed(1)}%;background:${col(i)}"></div>`).join('')}</div>
         <ul class="legend">${d.coverage.map((r, i) => `<li><span class="sw" style="background:${col(i)}"></span><span>${esc(r.region)}</span><span class="muted">${Math.round(r.share * 100)}%</span></li>`).join('')}</ul>`
      : '<p class="muted" style="margin:0">No tracked voices yet.</p>';
    const thin = d.coverage.filter((r) => r.share < 0.1).map((r) => r.region);
    const dev = d.developments.length
      ? `<ol class="dev">${d.developments.map((x) => `<li><span class="muted">${esc(clock(x.at))}</span><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(title(x.text))}</a></li>`).join('')}</ol>`
      : '<p class="muted" style="margin:0">Nothing confirmed by two independent outlets yet.</p>';
    return `<aside>
      <section><h2>Who you're hearing from</h2>${cov}${thin.length ? `<p class="notes warn" style="margin:12px 0 0">Little coverage from ${esc(thin.join(', '))}. Treat early claims with care.</p>` : ''}</section>
      <section><h2>Key developments</h2>${dev}</section>
    </aside>`;
  }

  function spikeLine(d) {
    const recent = d.activity.slice(-4).reduce((a, b) => a + b.count, 0) / 4;
    const before = d.activity.slice(0, -4).reduce((a, b) => a + b.count, 0) / Math.max(1, d.activity.length - 4);
    return recent > before * 1.5 ? `Activity is up ${Math.round(recent / Math.max(before, 0.1))} times in the last 4 hours.` : 'No unusual spike in activity.';
  }

  function render() {
    const d = state.data;
    const app = document.getElementById('app');
    const crumbs = d.crumbs.map((c, i) => (i === d.crumbs.length - 1 ? `<span class="here" aria-current="page">${esc(c.label)}</span>` : `<a href="${href(c.id)}">${esc(c.label)}</a><span aria-hidden="true">/</span>`)).join('');
    const seen = state.baseline;
    const c = changes(d);
    const visible = d.stories.filter((s) => state.lens === 'all' || s.lenses.includes(state.lens));
    const broader = d.parent ? ` <a href="${href(d.parent.id)}">Show broader: ${esc(d.parent.label)}</a>.` : '';
    const narrower = d.children.length ? ` Narrower: ${d.children.map((x) => `<a href="${href(x.id)}">${esc(x.label)}</a>`).join(', ')}.` : '';
    app.innerHTML = `
      ${d.demo ? '<div class="banner" role="status">Demo mode: made-up sample posts from fictional accounts, run through the real pipeline. Live Bluesky data runs without demo mode.</div>' : ''}
      <header class="top">
        <div style="display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center">
          <span class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--track)" stroke-width="4"/><path d="M14 4a10 10 0 0 1 9.5 13" fill="none" stroke="var(--loop)" stroke-width="4" stroke-linecap="round"/></svg>in the loop</span>
          <nav class="crumbs" aria-label="Topic path">${crumbs}</nav>
          ${window.itlStatic ? `<nav class="tabs" aria-label="View"><a href="#" aria-current="page">Briefing</a><a href="live.html${state.demo ? '?demo=1' : ''}">Live map</a></nav>` : ''}
        </div>
        <div class="seg" role="group" aria-label="Time window">${WINDOWS.map((w) => `<button data-since="${w}" aria-pressed="${w === state.since}">${w}</button>`).join('')}</div>
      </header>
      <section class="hero">
        ${dial(d, c)}
        <div>
          <h1>${esc(d.node.label)}</h1>
          <p class="sub">${spikeLine(d)} Following ${plural(d.stats.voices, 'voice')}, updated ${esc(ago(d.generatedAt))}.${broader}${narrower}</p>
          ${sinceList(d, c)}
        </div>
      </section>
      <main>
        <div class="col">
          <div class="listhead"><h2>Storylines</h2><div class="lenses" role="group" aria-label="Lens">${LENSES.map(([k, l]) => `<button data-lens="${k}" aria-pressed="${k === state.lens}">${l}</button>`).join('')}</div></div>
          ${visible.length ? visible.map((s) => story(s, !seen || !seen.status[s.id])).join('') : '<p class="muted" style="padding:28px 0">No storylines for this lens in this window.</p>'}
          <p class="footnote">Ranked by engagement compared with each account's usual, boosted when other credible voices share or quote it. Confirmed means two independent outlets. In the Loop only reads Bluesky and never posts.</p>
          ${d.missingVoices.length ? `<p class="notes">Voices not found on Bluesky: ${esc(d.missingVoices.join(', '))}</p>` : ''}
          ${d.errors.length ? `<details class="notes"><summary>${plural(d.errors.length, 'warning')}</summary><ul>${d.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
        </div>
        ${side(d)}
      </main>`;
    app.querySelectorAll('[data-lens]').forEach((b) => b.addEventListener('click', () => { state.lens = b.dataset.lens; render(); }));
    app.querySelectorAll('[data-since]').forEach((b) => b.addEventListener('click', () => { state.since = b.dataset.since; load(); }));
    const mr = app.querySelector('#markread');
    if (mr) mr.addEventListener('click', () => { saveSeen(d.node.id, d); state.baseline = loadSeen(d.node.id); render(); });
  }

  async function load() {
    const q = new URLSearchParams({ since: state.since });
    if (state.node) q.set('node', state.node);
    if (state.demo) q.set('demo', '1');
    history.replaceState(null, '', `?${q}`);
    try {
      let body;
      if (window.itlStatic) {
        // GitHub Pages build: the pipeline runs here in the browser (src/static.js).
        body = await (await window.itlStatic)({ node: state.node, since: state.since, demo: state.demo });
      } else {
        const res = await fetch(`/api/brief?${q}`);
        body = await res.json();
        if (!res.ok) throw new Error(body.error || res.statusText);
      }
      // Compare against what this browser saw last time; on a first visit, remember now.
      if (!state.data || state.data.node.id !== body.node.id) state.baseline = loadSeen(body.node.id);
      if (!state.baseline && !loadSeen(body.node.id)) saveSeen(body.node.id, body);
      state.data = body;
      state.node = body.node.id;
      render();
    } catch (err) {
      document.getElementById('app').innerHTML = `<p class="loading">Could not load the briefing: ${esc(err.message)}</p>`;
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
