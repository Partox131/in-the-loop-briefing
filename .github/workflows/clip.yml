name: Daily clip

# Records "Today's loop" from the live site as a 1080 x 1920 video for TikTok,
# YouTube Shorts and Instagram Reels, with a spoken voiceover of each story card
# (Piper, free offline text-to-speech) and a music bed we make ourselves
# (scripts/make-music.py: pulse, drift, tension or bright). The videos are attached to the run as a
# download ("clips") and the latest set is also kept on the `clips` branch;
# nothing is posted anywhere. Built from deploy/clip.yml in
# the private repo; edit it there, not here. Run it from the Actions tab
# ("Run workflow") or with: gh workflow run clip.yml

on:
  # Every morning at 5:30 AM Toronto (10:30 UTC; 6:30 AM in summer), before
  # the 6:43 AM drafts run picks the video up for the Daily posts page.
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      segments:
        description: 'Segments to record: geo, us, ca (comma-separated)'
        default: 'geo'
      stop:
        description: 'Milliseconds per story card'
        default: '9000'
      music:
        description: 'Background music: pulse, drift, tension, bright or none'
        default: 'tension'
      voice:
        description: 'Voice: kokoro:<name> (af_heart, af_bella, am_michael, am_fenrir, bf_emma, bm_george) or piper:<name> (ryan, lessac)'
        default: 'kokoro:af_heart'

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Kokoro needs Python < 3.13
      - name: Install Playwright, ffmpeg and the voice
        env:
          VOICE_IN: ${{ inputs.voice || 'kokoro:af_heart' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          pip install --quiet numpy
          bash tools/setup-voice.sh "$VOICE_IN" "$RUNNER_TEMP"
      - name: Record and add the voiceover
        env:
          MUSIC: ${{ inputs.music || 'tension' }}
        run: |
          set -a; . "$RUNNER_TEMP/voice.env"; set +a
          mkdir -p clips
          day=$(TZ=America/Toronto date +%F)
          case "$MUSIC" in pulse|drift|tension|bright|none) music="$MUSIC" ;; *) music=tension ;; esac
          if [ "$music" != none ]; then python3 tools/make-music.py "$RUNNER_TEMP/music" "$music"; fi
          for seg in $(echo "${{ inputs.segments || 'geo' }}" | tr ',' ' '); do
            case "$seg" in
              us) q="?segment=us"; word="in US politics" ;;
              ca) q="?segment=ca"; word="in Canadian politics" ;;
              *)  q="?";           word="around the world" ;;
            esac
            url="https://inthelooplive.com/${q}&stop=${{ inputs.stop || '9000' }}&noloop"
            node tools/record-loop.cjs "$url" "clips/silent-$seg-$day.mp4" || continue
            node tools/voiceover.cjs "clips/silent-$seg-$day.mp4" "clips/voice-$seg-$day.mp4" "$word" || continue
            mv "clips/voice-$seg-$day.script.txt" "clips/loop-$seg-$day.script.txt"
            if [ "$music" != none ]; then
              node tools/add-music.cjs "clips/voice-$seg-$day.mp4" "$RUNNER_TEMP/music/$music.wav" "clips/loop-$seg-$day.mp4" && rm "clips/voice-$seg-$day.mp4"
            else
              mv "clips/voice-$seg-$day.mp4" "clips/loop-$seg-$day.mp4"
            fi
          done
          ls -la clips
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/
          retention-days: 14
      - name: Keep the latest clips on the clips branch
        continue-on-error: true
        run: |
          cd clips
          git init -q -b clips
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Clips $(TZ=America/Toronto date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" clips
