<style>

      --bg: #12142B; --raise: #1B1E3B; --ink: #E7E9F5; --muted: #A3A8C8; --line: #2C3056; --track: #2A2E52;

    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }

  .steps li + li::after { content: ''; position: absolute; top: 8px; right: 50%; width: 100%; height: 2px; background: var(--line); }

  .story h3 a { color: inherit; text-decoration: none; }

  details .rel { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; max-width: 68ch; }

  aside h2 { margin: 0 0 14px; font: 600 20px/1.2 var(--display); }
  .stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--track); }
  .legend { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .legend li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .notes { font-size: 14px; color: var(--muted); }
  .warn { color: var(--warn); }
  ol.dev { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 15px; }
  ol.dev li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; }
  ol.dev a { color: inherit; text-decoration: none; } ol.dev a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .banner { background: var(--banner-bg); color: var(--reported); padding: 10px 56px; font-size: 14px; }
  .footnote { margin-top: 28px; font-size: 14px; color: var(--muted); max-width: 72ch; }
  .loading { padding: 64px 32px; text-align: center; color: var(--muted); }
  /* Loading: the Live dial "catching up" (Amir picked it, 26 Nov 2026). The arc closes the loop, then reopens a turn further on. */
  /* First-load screen fills the window with a big dial (Amir, 27 Nov 2026); anything after it (the crawler text on the map page) sits below the fold. */
  .loading:has(.loopspin) { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 32px; box-sizing: border-box; font-size: 17px; }
  .loopspin { width: 64px; height: 64px; flex: none; overflow: visible; }
  .loading > .loopspin { width: clamp(120px, 30vmin, 200px); height: auto; aspect-ratio: 1; }
  .loopspin .t { fill: none; stroke: var(--ink); stroke-opacity: .2; stroke-width: 9; }
  .loopspin .a { fill: none; stroke: var(--loop); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 94.25 125.66; transform-origin: 32px 32px; transform: rotate(-90deg); animation: loopcatch 1.6s cubic-bezier(.45, 0, .25, 1) infinite; }
  .loopspin .d { fill: var(--ink); transform-origin: 32px 32px; animation: loopbreathe 1.6s ease-in-out infinite; }
  .waitnote .loopspin { width: 18px; height: 18px; vertical-align: -4px; margin-right: 7px; }
  @keyframes loopcatch { 0% { stroke-dasharray: 94.25 125.66; transform: rotate(-90deg); } 50% { stroke-dasharray: 125.66 0; transform: rotate(-90deg); } 100% { stroke-dasharray: 94.25 125.66; transform: rotate(270deg); } }
  @keyframes loopbreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .loopspin .a, .loopspin .d { animation-duration: 4s; } }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .mini { order: 2; width: 100%; max-width: 560px; }
  }
  @media (max-width: 640px) {
    header.top, .hero, main { padding-left: 16px; padding-right: 16px; }
    .banner { padding: 10px 16px; }
    article.story { grid-template-columns: 1fr; }
    ol.rail { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    ol.rail li + li { margin-top: 0; }
    ol.rail li + li::before { display: none; }
  }
  .sides .record { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  details.tl { margin: 10px 0 0; font-size: 14px; }
  details.tl summary { cursor: pointer; color: var(--muted); }
  details.tl .tlnew { color: var(--ink); font-weight: 600; margin-left: 6px; }
  details.tl ol { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--track); }
  details.tl li { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 0; position: relative; }
  details.tl li::before { content: ''; position: absolute; left: -20px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--track); }
  details.tl li.s-corroborated::before { background: var(--confirmed); border-color: var(--confirmed); }
  details.tl li.s-disputed::before { background: var(--disputed); border-color: var(--disputed); }
  details.tl li.k-claim::before { border-style: dashed; }
  details.tl li.new time { font-weight: 600; color: var(--ink); }
  details.tl li.new time::after { content: ' · new'; }
  details.tl time { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { details.tl li { grid-template-columns: 1fr; gap: 0; } }
  .statetag { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .flag { width: 16px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 20%, transparent); object-fit: cover; flex: none; }

<script>window.itlSearch = location.search; window.itlStatic = import('./src/static.js?v=8f2b475557').then((m) => m.init({ search: window.itlSearch }));</script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const state = { node: params.get('node') || '', since: params.get('since') || '24h', lens: 'all', data: null, baseline: null, demo: params.has('demo') };
  const href = (node) => `?node=${encodeURIComponent(node)}&since=${state.since}${state.demo ? '&demo=1' : ''}`;
  const LENSES = [['all', 'Everything'], ['military', 'Military'], ['diplomacy', 'Diplomacy'], ['economy', 'Economy and energy'], ['humanitarian', 'Humanitarian']];
  const WINDOWS = ['6h', '12h', '24h', '48h', '7d'];

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // State-affiliated and partisan sources: the state's flag (src/flags.js) and
  // their class from the credibility profile (src/credibility.js): "state",
  // "state-funded", "public", "official" or "partisan", with a tooltip saying
  // in which conflicts the source speaks for a side.
  const countryName = (c) => { try { return new Intl.DisplayNames(['en'], { type: 'region' }).of(c); } catch { return c; } };
  // Track record on claims for a side (server, scripts/stories.js records): rule-based,
  // how often an independent source later reported the same storyline.
  const recordOf = (aff) => (aff && state.data?.records?.[aff]) || null;
  const recordText = (aff) => {
    const r = recordOf(aff);
    if (!r?.claims) return '';
    const parts = [`${r.confirmed} later reported by an independent source`, `${r.unconfirmed} not within 48 hours`];
    if (r.pending) parts.push(`${r.pending} too recent to tell`);
    if (r.disputed) parts.push(`${r.disputed} disputed`);
    const first = r.first ? ` First to report ${r.first === 1 ? 'once' : `${r.first} times`}${r.leadHours != null ? `, by a median ${r.leadHours}h` : ''}.` : '';
    return `Track record, last 30 days: ${r.claims === 1 ? '1 claim' : `${r.claims} claims`} for a side; ${parts.join(', ')}.${first}`;
  };
  const stateTag = (c, long, cred, aff) => {
    const name = c ? countryName(c) : '';
    const rec = recordText(aff);
    const title = (name ? `${name}. ` : '') + (cred?.note || 'State-affiliated') + (rec ? ` ${rec}` : '');
    const img = /^[A-Z]{2}$/.test(c || '') ? `<img class="flag" src="flags/${c.toLowerCase()}.svg" alt="${esc(name)}" width="16" height="12">` : '';
    const word = cred?.short && cred.short !== 'state' ? cred.short : long ? 'state-affiliated' : 'state';
    return ` <span class="statetag" title="${esc(title)}">${img}${word}</span>`;
  };
  const tagged = (x) => x && (x.stateAffiliated || x.cred?.short === 'partisan');
  const safeUrl = (u) => (/^https:\/\//.test(u || '') ? esc(u) : '#');
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  };
  const clock = (iso) => {
    const d = new Date(iso);
    return Date.now() - d < 86400000 ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { weekday: 'short' });
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const oneLine = (t, n = 220) => { const s = String(t || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const title = (t) => oneLine(String(t || '').split(/(?<=[.!?])\s/)[0], 140);

  // What this browser saw on its last visit (marks new storylines on the cards).
  const storeKey = (node) => `itl:seen:${node}`;
  const loadSeen = (node) => { try { return JSON.parse(localStorage.getItem(storeKey(node))) || null; } catch { return null; } };
  const saveSeen = (node, d) => { try { localStorage.setItem(storeKey(node), JSON.stringify({ at: Date.now(), status: Object.fromEntries(d.stories.map((s) => [s.id, s.status])) })); } catch {} };

  const STATE_LABEL = { disputed: 'Sources disagree', corroborated: 'Confirmed', reported: 'Reported once', official: 'Official statement', claimed: 'Claimed by one side' };
  const DAY = 86400000;

  // The mini map: the region's outlines (public/maps.json, loaded once, the
  // live map shares the browser cache) with a pin per place that has storylines.
  let mapsP = null;
  const mapViews = () => (mapsP ||= fetch('maps.json').then((r) => (r.ok ? r.json() : null)).then((j) => j && j.views).catch(() => { mapsP = null; return null; }));
  const PIN = { disputed: 'disputed', corroborated: 'confirmed', reported: 'reported-dot', claimed: 'reported-dot' };

  function miniSvg(v, m) {
    const P = (lon, lat) => [((lon - v.west) / (v.east - v.west)) * v.width, ((v.north - lat) / (v.north - v.south)) * v.height];
    // Crop around the pins (and the place this page is about), 4:3, never tighter than 45% of the region.
    const pts = [...m.pins, ...(m.focus ? [m.focus] : [])].map((p) => P(p.lon, p.lat));
    const city = !v.countries.length;
    let [x0, y0, x1, y1] = pts.length && !city ? [Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1])), Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))] : [0, 0, v.width, v.height];
    let w = Math.max(x1 - x0, v.width * 0.45), h = Math.max(y1 - y0, (w * 3) / 4);
    w = Math.max(w, (h * 4) / 3); w *= city ? 1 : 1.3; h = (w * 3) / 4;
    let cx = (x0 + x1) / 2 - w / 2, cy = (y0 + y1) / 2 - h / 2;
    cx = Math.min(Math.max(cx, Math.min(0, v.width - w)), Math.max(0, v.width - w));
    cy = Math.min(Math.max(cy, Math.min(0, v.height - h)), Math.max(0, v.height - h));
    const sw = w / 420; // one screen pixel, roughly
    const shapes = city
      ? ((v.city && v.city.shapes) || []).map((x) => x.kind.startsWith('road') ? `<path d="${x.d}" fill="none" stroke="var(--line)" stroke-width="${(x.kind === 'road major' ? 4 : 2) * sw}"/>` : `<path class="${x.kind === 'water' ? 'water' : x.kind === 'park' ? 'park' : 'land'}" d="${x.d}" stroke-width="${sw}"/>`).join('')
      : [...v.countries, ...(v.states || [])].map((x) => `<path class="land" d="${x.d}" stroke-width="${(v.states && v.states.includes(x) ? 0.8 : 1.2) * sw}"/>`).join('');
    const pins = m.pins.map((p) => {
      const [x, y] = P(p.lon, p.lat);
      const r = 11 * sw, here = m.focus && m.focus.id === p.id;
      return `<g class="pin"><title>${esc(p.label)}: ${plural(p.count, 'storyline')}</title><circle cx="${x}" cy="${y}" r="${r * (1.5 + Math.min(p.count, 6) * 0.25)}" fill="var(--${PIN[p.status] || 'confirmed'})" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--${PIN[p.status] || 'confirmed'})" stroke="${here ? 'var(--ink)' : 'var(--raise)'}" stroke-width="${3 * sw}"/><text x="${x}" y="${y + 4.5 * sw}" text-anchor="middle" font-size="${13 * sw}">${p.count}</text></g>`;
    }).join('');
    return `<svg viewBox="${cx.toFixed(1)} ${cy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${shapes}${pins}</svg>`;
  }

  function miniMap(d) {
    const m = d.mini;
    const n = m.pins.reduce((a, p) => a + p.count, 0);
    const where = m.pins.length ? `${plural(n, 'storyline')} in ${plural(m.pins.length, 'place')}` : 'No storylines with a place yet';
    return `<figure class="mini"><a class="mapbox" href="${mapHref(d)}" aria-label="Open on the live map. ${esc(where)}." data-view="${esc(m.view)}"></a><figcaption><span>${esc(where)}, last ${esc(state.since)}</span><a href="${mapHref(d)}">Open on the map →</a></figcaption></figure>`;
  }

  async function fillMini(d) {
    const box = document.querySelector('.mini .mapbox');
    if (!box) return;
    const views = await mapViews();
    const v = views && views[d.mini.view];
    if (v && box.isConnected) box.innerHTML = miniSvg(v, d.mini);
  }


  function disagreement(x) {
    if (x.type === 'numbers') {
      return `<p class="numcap">Sources give different numbers (${esc(x.kind)})</p><div class="numbers">${x.sides.map((s) => `<div><div class="num">${esc(s.value.toLocaleString())}</div><div class="who">per ${esc(s.sources.join(', '))}</div><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(clock(s.at))}, view source</a></div>`).join('')}</div>`;
    }
    return `<blockquote class="push"><strong>${esc(x.from.affiliation)}</strong> pushes back on <strong>${esc(x.to.affiliation)}</strong>: “${esc(oneLine(x.from.text, 200))}” <a href="${safeUrl(x.from.url)}" target="_blank" rel="noopener">View post</a></blockquote>`;
  }

  // A small timeline of how the claim has moved so far.
  function rail(s) {
    const steps = [s.status === 'claimed' ? { cls: 'claimed', text: `${claimText(s)} ${clock(s.firstSeen)}` } : { cls: 'reported', text: `Reported ${clock(s.firstSeen)}` }];
    const latestSide = s.disagreements.flatMap((x) => (x.type === 'numbers' ? x.sides.map((y) => y.at) : [])).sort().at(-1);
    if (s.status === 'disputed') steps.push({ cls: 'disputed', text: latestSide ? `Split ${clock(latestSide)}` : 'Challenged' });
    else if (s.status === 'corroborated' && s.firstClaim && s.firstWitness) steps.push({ cls: 'corroborated', text: `Confirmed by ${s.firstWitness.by} ${clock(s.firstWitness.at)}` });
    else if (s.status === 'corroborated') steps.push({ cls: 'corroborated', text: `${s.sources.length} outlets agree` });
    else if (s.status === 'official') steps.push({ cls: 'official', text: 'Officials confirm' });
    else if (s.status === 'claimed') steps.push({ cls: '', text: 'Not confirmed by a source outside the conflict' });
    else if (now() - Date.parse(s.lastSeen) < DAY) steps.push({ cls: '', text: 'Waiting for a second source' });
    return `<ol class="rail">${steps.map((x) => `<li><span class="dot ${x.cls}"></span>${esc(x.text)}</li>`).join('')}</ol>`;
  }
  // A side's own claim (src/credibility.js): "Iran claims", shown as a dashed chip
  // until a source with no stake in the conflict reports it too.
  const SIDE_NAME = { PS: 'Palestinians', US: 'The US' };
  const sideName = (c) => SIDE_NAME[c] || (/^[A-Z]{2}$/.test(c || '') ? countryName(c) : c || 'One side');
  const claimText = (x) => { const names = (x.claimedBy?.length ? x.claimedBy : ['']).map(sideName); return `${names.join(' and ')} ${names.length > 1 || /s$/.test(names[0]) ? 'claim' : 'claims'}`; };
  const now = () => Date.parse(state.data.generatedAt);

  // What each side says (source credibility plan, part 3): the latest claim
  // from each side in the conflict, and who reported first.
  const gap = (a, b) => { const h = (Date.parse(b) - Date.parse(a)) / 3_600_000; return h >= 1 ? `${Math.round(h * 10) / 10}h` : `${Math.max(1, Math.round(h * 60))} min`; };
  function sidesBlock(s) {
    if (!s.sides?.length) return '';
    const first = s.firstClaim && s.firstWitness && Date.parse(s.firstClaim.at) < Date.parse(s.firstWitness.at)
      ? `<p class="firstnote">First reported by ${esc(s.firstClaim.by)} (for ${esc(sideName(s.firstClaim.side))}), ${gap(s.firstClaim.at, s.firstWitness.at)} before an independent source (${esc(s.firstWitness.by)}).</p>`
      : '';
    return `<div class="sides"><p class="sideshead">What each side says</p><ul>${s.sides.map((x) => `<li><strong>${esc(sideName(x.side))}</strong> <span class="muted">via ${esc(x.by)}, ${esc(ago(x.at))}</span>: <a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(oneLine(x.text, 160))}</a>${recordText(x.by) ? `<span class="record">${esc(x.by)}: ${esc(recordText(x.by).replace(/^Track record, /, ''))}</span>` : ''}</li>`).join('')}</ul>${s.status === 'claimed' ? '<p class="muted" style="margin:4px 0 0">No source outside the conflict has reported this yet.</p>' : ''}${first}</div>`;
  }

  // How the storyline developed, kept by the server over days (stories.json,
  // source credibility plan part 4). Moments after your last visit are marked.
  const dayTime = (iso) => new Date(iso).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const MOMENT = {
    corroborated: 'Now confirmed: a source outside the conflict reports it',
    claimed: 'Only one side says this so far',
    reported: 'Reported by one independent source',
    disputed: 'Sources disagree',
    official: 'Official statement',
  };
  function moment(e, claimed) {
    const quote = e.text ? `: <a href="${safeUrl(e.url)}" target="_blank" rel="noopener">${esc(oneLine(e.text, 140))}</a>` : '';
    const lead = e.isFirst ? 'First report: ' : '';
    if (e.kind === 'first') return `<strong>First reported</strong> by ${esc(e.by)}${quote}`;
    if (e.kind === 'claim') return `<strong>${lead}${esc(sideName(e.side))} claims</strong>, via ${esc(e.by)}${quote}`;
    if (e.kind === 'witness') return `<strong>${lead}${e.isFirst ? 'independent' : 'Independent'} report</strong> from ${esc(e.by)}${quote}`;
    if (e.to === 'corroborated') return `<strong>${claimed ? 'Now confirmed: a source outside the conflict reports it too' : 'Now confirmed by two independent sources'}</strong>${e.by ? ` (${esc(e.by)})` : ''}`;
    return `<strong>${esc(MOMENT[e.to] || e.to)}</strong>`;
  }
  function timelineBlock(s) {
    let events = (s.history?.events || []).filter((e) => !(e.kind === 'status' && !e.from));
    // The first report is usually also the first claim or independent report: show it once.
    const first = events.find((e) => e.kind === 'first');
    const same = first && events.find((e) => (e.kind === 'claim' || e.kind === 'witness') && e.at === first.at && e.by === first.by);
    if (same) events = events.filter((e) => e !== first).map((e) => (e === same ? { ...e, isFirst: true } : e));
    const claimed = events.some((e) => e.kind === 'claim');
    if (events.length < 2) return '';
    const since = state.baseline?.at || 0;
    const fresh = since ? events.filter((e) => Date.parse(e.at) > since).length : 0;
    return `<details class="tl"><summary>How it developed: ${plural(events.length, 'moment')} since ${esc(dayTime(s.history.firstSeen))}${fresh ? ` <span class="tlnew">${fresh} new since you last checked</span>` : ''}</summary><ol>${events.map((e) => `<li class="${since && Date.parse(e.at) > since ? 'new' : ''} k-${esc(e.kind)}${e.to ? ` s-${esc(e.to)}` : ''}"><time datetime="${esc(e.at)}">${esc(dayTime(e.at))}</time><span>${moment(e, claimed)}</span></li>`).join('')}</ol></details>`;
  }

  function story(s, isNew) {
    const voice = s.lead.voice;
    const who = (voice ? `${esc(voice.name)}${tagged(voice) ? stateTag(voice.country, true, voice.cred, voice.affiliation) : ''}` : `@${esc(s.lead.handle)}`) + (s.lead.telegram ? ' (Telegram)' : s.lead.news ? ' (news article)' : '');
    const lift = s.lead.why?.amplifiedBy ? `, shared by ${plural(s.lead.why.amplifiedBy, 'other voice')}` : '';
    const topic = s.topicId !== state.data.node.id ? ` In ${esc(s.topicLabel)}.` : '';
    const sources = s.sources.length ? `<p class="sources">Sources: ${s.sources.map((x) => `${esc(x.affiliation)}${tagged(x) ? stateTag(x.country, false, x.cred, x.affiliation) : ''}`).join(', ')}</p>` : '';
    const related = s.related.length
      ? `<details><summary>${s.postCount - 1 > s.related.length ? `Top ${s.related.length} of ${s.postCount - 1} related posts` : plural(s.postCount - 1, 'related post')}</summary><div class="rel">${s.related.map((p) => `<div><strong>${esc(p.voice ? p.voice.name : '@' + p.handle)}</strong>${tagged(p.voice) ? stateTag(p.voice.country, false, p.voice.cred, p.voice.affiliation) : ''} <span class="muted">${esc(ago(p.createdAt))}</span><br>${esc(oneLine(p.text))} <a href="${safeUrl(p.url)}" target="_blank" rel="noopener">${p.telegram ? 'View on Telegram' : p.news ? 'Read article' : 'View post'}</a></div>`).join('')}</div></details>`
      : '';
    return `<article class="story">
      <div>${s.breaking ? `<span class="breakingtag" title="First reported under 3 hours ago, by ${s.breaking} independent outlets within 90 minutes">Breaking · ${plural(s.breaking, 'outlet')}</span>` : ''}<div class="state ${s.status}"><span class="dot ${s.status}"></span>${s.status === 'claimed' ? esc(claimText(s)) : STATE_LABEL[s.status]}</div>${rail(s)}${isNew ? '<span class="newtag">New to you</span>' : ''}</div>
      <div>
        <h3><a href="${safeUrl(s.lead.url)}" target="_blank" rel="noopener">${esc(oneLine(s.lead.text, 280))}</a></h3>
        <p class="by">Led by ${who}, ${esc(ago(s.lead.createdAt))}${lift}. ${[s.postCount - s.articleCount ? plural(s.postCount - s.articleCount, 'post') : '', s.articleCount ? plural(s.articleCount, 'news article') : ''].filter(Boolean).join(' and ')} from ${plural(s.voiceCount, 'source')}.${topic}${s.history && Date.now() - Date.parse(s.history.firstSeen) > DAY ? ` Followed since ${esc(new Date(s.history.firstSeen).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }))}.` : ''}</p>
        ${s.disagreements.map(disagreement).join('')}
        ${sidesBlock(s)}
        ${timelineBlock(s)}
        ${sources}
        ${related}
      </div>
    </article>`;
  }

  function side(d) {
    const colors = ['--r1', '--r2', '--r3', '--r4', '--r5', '--r6'];
    const col = (i) => `var(${colors[i % colors.length]})`;
    const cov = d.coverage.length
      ? `<div class="stack" role="img" aria-label="Share of posts by region">${d.coverage.map((r, i) => `<div style="width:${(r.share * 100).toFixed(1)}%;background:${col(i)}"></div>`).join('')}</div>
         <ul class="legend">${d.coverage.map((r, i) => `<li><span class="sw" style="background:${col(i)}"></span><span>${esc(r.region)}</span><span class="muted">${Math.round(r.share * 100)}%</span></li>`).join('')}</ul>`
      : '<p class="muted" style="margin:0">No tracked voices yet.</p>';
    const thin = d.coverage.filter((r) => r.share < 0.1).map((r) => r.region);
    const dev = d.developments.length
      ? `<ol class="dev">${d.developments.map((x) => `<li><span class="muted">${esc(clock(x.at))}</span><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(title(x.text))}</a></li>`).join('')}</ol>`
      : '<p class="muted" style="margin:0">Nothing confirmed yet: a story needs two independent sources, or an official one.</p>';
    return `<aside>
      <section><h2>Who you're hearing from</h2>${cov}${thin.length ? `<p class="notes warn" style="margin:12px 0 0">Little coverage from ${esc(thin.join(', '))}. Treat early claims with care.</p>` : ''}</section>
      <section><h2>Key developments</h2>${dev}</section>
    </aside>`;
  }

  // Back to the live map, on the view this page came from (story picked).
  function mapHref(d) {
    const q = new URLSearchParams();
    if (d.map) {
      if (d.map.segment && d.map.segment !== 'geo') q.set('segment', d.map.segment);
      if (d.map.view !== 'world') q.set('view', d.map.view);
      if (d.map.area) q.set('area', d.map.area);
    }
    if (state.demo) q.set('demo', '1');
    return `index.html${q.size ? `?${q}` : ''}`;
  }

  // What changed, from the data: no AI. An AI paragraph can sit above it later.
  function recapLine(d) {
    const r = d.recap;
    if (!r || !d.node.kind) return '';
    if (!r.updates) return `<p class="recap">Nothing new in the last ${esc(state.since)}.</p>`;
    const parts = [`<strong>${plural(r.updates, 'update')}</strong> in the last ${esc(state.since)} from ${plural(r.sources, 'source')}`];
    if (r.confirmed) parts.push(`${r.confirmed} confirmed by 2+ sources`);
    if (r.disputed) parts.push(`${r.disputed} disputed`);
    if (r.latest) parts.push(`latest ${esc(ago(r.latest))}`);
    return `<p class="recap">${parts.join(', ')}.${r.top ? ` Most covered: “${esc(oneLine(r.top, 160))}”` : ''}</p>`;
  }

  function spikeLine(d) {
    const recent = d.activity.slice(-4).reduce((a, b) => a + b.count, 0) / 4;
    const before = d.activity.slice(0, -4).reduce((a, b) => a + b.count, 0) / Math.max(1, d.activity.length - 4);
    return recent > before * 1.5 ? `Activity is up ${Math.round(recent / Math.max(before, 0.1))} times in the last 4 hours.` : 'No unusual spike in activity.';
  }

  function render() {
    const d = state.data;
    const app = document.getElementById('app');
    const crumbs = d.crumbs.map((c, i) => (i === d.crumbs.length - 1 ? `<span class="here" aria-current="page">${esc(c.label)}</span>` : `<a href="${href(c.id)}">${esc(c.label)}</a><span aria-hidden="true">/</span>`)).join('');
    const seen = state.baseline;
    const visible = d.stories.filter((s) => state.lens === 'all' || s.lenses.includes(state.lens));
    const broader = d.parent ? ` <a href="${href(d.parent.id)}">Show broader: ${esc(d.parent.label)}</a>.` : '';
    const narrower = d.children.length ? ` Narrower: ${d.children.map((x) => `<a href="${href(x.id)}">${esc(x.label)}</a>`).join(', ')}.` : '';
    app.innerHTML = `
      ${d.demo ? '<div class="banner" role="status">Demo mode: made-up sample posts from fictional accounts, run through the real pipeline. Live Bluesky data runs without demo mode.</div>' : ''}
      <header class="top">
        <div style="display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center">
          <a class="brand" href="index.html${state.demo ? '?demo=1' : ''}" title="Go to the home page"><svg class="dial" width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-opacity=".26" stroke-width="9"/><path d="M32 12A20 20 0 1 1 12 32" fill="none" stroke="var(--loop)" stroke-width="9" stroke-linecap="round"/><circle cx="32" cy="32" r="7" fill="currentColor"/></svg>in the loop</a>
          <nav class="crumbs" aria-label="Topic path">${crumbs}</nav>
          ${window.itlStatic ? `<a class="backlink" href="${mapHref(d)}">← ${d.map ? 'Back to the map' : 'Live map'}</a>` : ''}
        </div>
        <div class="seg" role="group" aria-label="Time window">${WINDOWS.map((w) => `<button data-since="${w}" aria-pressed="${w === state.since}">${w}</button>`).join('')}</div>
      </header>
      <section class="hero${d.mini ? '' : ' one'}">
        ${d.mini ? miniMap(d) : ''}
        <div>
          ${d.node.kind ? `<p class="kind">${d.node.kind === 'story' ? `Story · ${esc(d.crumbs.at(-2)?.label || '')}` : d.node.kind === 'topic' ? 'Topic' : 'Region'}</p>` : ''}
          <h1>${esc(d.node.label)}</h1>
          ${d.node.about ? `<p class="about">${esc(d.node.about)}</p>` : ''}
          ${d.track ? `<div class="steps" aria-label="Where it stands: ${esc(d.track.label)}, step ${d.track.at + 1} of ${d.track.stages.length}"><span class="kind">Where it stands</span><ol>${d.track.stages.map((x, i) => `<li class="${i < d.track.at ? 'done' : i === d.track.at ? 'cur' : ''}">${esc(x)}</li>`).join('')}</ol><p>Based on what these reports say, not an official record.</p></div>` : ''}
          ${recapLine(d)}
          <p class="sub">${spikeLine(d)} Following ${plural(d.stats.voices, 'Bluesky voice')}${d.stats.articles ? ` and ${plural(d.stats.articles, 'news article')} from ${plural(d.stats.outlets, 'outlet')}` : ''}, updated ${esc(ago(d.generatedAt))}.${broader}${narrower}</p>
        </div>
      </section>
      <main>
        <div class="col">
          <div class="listhead"><h2>${d.node.kind === 'story' ? 'Updates in this story' : 'Storylines'}</h2><div class="lenses" role="group" aria-label="Lens">${LENSES.map(([k, l]) => `<button data-lens="${k}" aria-pressed="${k === state.lens}">${l}</button>`).join('')}</div></div>
          ${visible.length ? visible.map((s) => story(s, !seen || !seen.status[s.id])).join('') : '<p class="muted" style="padding:28px 0">No storylines for this lens in this window.</p>'}
          <itl-signup source="briefing"></itl-signup>
          ${d.missingVoices.length ? `<p class="notes">Voices not found on Bluesky: ${esc(d.missingVoices.join(', '))}</p>` : ''}
          ${d.errors.length ? `<details class="notes"><summary>${plural(d.errors.length, 'warning')}</summary><ul>${d.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
        </div>
        ${side(d)}
      </main>`;
    app.querySelectorAll('[data-lens]').forEach((b) => b.addEventListener('click', () => { window.itlTrack?.('briefing_filter', { filter: 'lens', value: b.dataset.lens, node: d.node.id }); state.lens = b.dataset.lens; render(); }));
    app.querySelectorAll('[data-since]').forEach((b) => b.addEventListener('click', () => { window.itlTrack?.('briefing_filter', { filter: 'since', value: b.dataset.since, node: d.node.id }); state.since = b.dataset.since; load(); }));
    if (d.mini) fillMini(d);
  }

  async function load() {
    const q = new URLSearchParams({ since: state.since });
    if (state.node) q.set('node', state.node);
    if (state.demo) q.set('demo', '1');
    history.replaceState(null, '', `?${q}`);
    try {
      let body;
      if (window.itlStatic) {
        // GitHub Pages build: the pipeline runs here in the browser (src/static.js).
        body = await (await window.itlStatic)({ node: state.node, since: state.since, demo: state.demo });
      } else {
        const res = await fetch(`/api/brief?${q}`);
        body = await res.json();
        if (!res.ok) throw new Error(body.error || res.statusText);
      }
      // Compare against what this browser saw last time; on a first visit, remember now.
      // Story cards mark what's new since the last visit; each visit becomes the next one's baseline.
      if (!state.data || state.data.node.id !== body.node.id) { state.baseline = loadSeen(body.node.id); saveSeen(body.node.id, body); }
      state.data = body;
      state.node = body.node.id;
      render();
    } catch (err) {
      document.getElementById('app').innerHTML = `<p class="loading">Could not load the briefing: ${esc(err.message)}</p>`;
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
